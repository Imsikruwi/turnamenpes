<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagan Turnamen - Live</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0F172A',
                            800: '#1E293B',
                            700: '#334155',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; overscroll-behavior: none; }
        
        /* Tema Gelap (Default) */
        .theme-dark { background-color: #0F172A; color: #F8FAFC; }
        .theme-dark .bracket-card { background-color: #1E293B; border-color: #334155; }
        .theme-dark .bracket-card:hover { border-color: #475569; }
        .theme-dark .team-row { border-color: #334155; }
        .theme-dark .admin-bg { background-color: #0F172A; border-color: #334155; }
        
        /* Tema Biru */
        .theme-blue { background-color: #0c1527; color: #F8FAFC; }
        .theme-blue .bracket-card { background-color: #132442; border-color: #213e73; }
        .theme-blue .bracket-card:hover { border-color: #3058a3; }
        .theme-blue .team-row { border-color: #1a315a; }
        .theme-blue .admin-bg { background-color: #0c1527; border-color: #213e73; }
        
        /* Tema Terang (Fixed) */
        .theme-light { background-color: #F8FAFC; color: #0F172A; }
        .theme-light .bracket-card { background-color: white; border-color: #E2E8F0; }
        .theme-light .bracket-card:hover { border-color: #CBD5E1; }
        .theme-light .team-row { border-color: #E2E8F0; }
        .theme-light .admin-bg { background-color: #F1F5F9; border-color: #CBD5E1; }
        
        /* Tema Merah (Ruby) */
        .theme-red { background-color: #2a0f12; color: #F8FAFC; }
        .theme-red .bracket-card { background-color: #40151a; border-color: #73212b; }
        .theme-red .bracket-card:hover { border-color: #a3303d; }
        .theme-red .team-row { border-color: #5a1a22; }
        .theme-red .admin-bg { background-color: #2a0f12; border-color: #73212b; }

        /* Tema Hijau (Emerald) */
        .theme-emerald { background-color: #0f2a1b; color: #F8FAFC; }
        .theme-emerald .bracket-card { background-color: #154029; border-color: #21734b; }
        .theme-emerald .bracket-card:hover { border-color: #30a36a; }
        .theme-emerald .team-row { border-color: #1a5a38; }
        .theme-emerald .admin-bg { background-color: #0f2a1b; border-color: #21734b; }

        /* Tema Ungu (Amethyst) */
        .theme-purple { background-color: #1a0f2a; color: #F8FAFC; }
        .theme-purple .bracket-card { background-color: #281540; border-color: #462173; }
        .theme-purple .bracket-card:hover { border-color: #6330a3; }
        .theme-purple .team-row { border-color: #381a5a; }
        .theme-purple .admin-bg { background-color: #1a0f2a; border-color: #462173; }

        /* General UI Elements */
        .team-name, .score-input { color: inherit; } 

        .match-card {
            width: 210px;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 10;
        }

        .line-path {
            stroke-width: 2;
            fill: none;
            transition: all 0.3s ease;
        }
        
        @keyframes pulse-border {
            0% { border-color: #f59e0b; }
            50% { border-color: #fbbf24; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            100% { border-color: #f59e0b; }
        }
        .is-final { animation: pulse-border 2.5s infinite; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="theme-dark h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-black/20 backdrop-blur-sm border-b border-white/10 px-6 py-4 flex items-center justify-between shrink-0 z-50 sticky top-0">
        <div class="flex items-center gap-3 w-1/3">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center shrink-0 shadow-lg shadow-blue-500/30">
                <i data-lucide="trophy" class="w-6 h-6 text-white"></i>
            </div>
            <div class="flex-1">
                <!-- Title is now editable & syncs! -->
                <input type="text" id="tournament-title" onchange="updateTitle(this.value)" placeholder="Nama Turnamen..." class="font-bold text-xl bg-transparent border-none outline-none focus:border-b border-blue-500 w-full" readonly>
                <div class="text-xs text-gray-400 mt-1" id="sync-status">Menghubungkan ke server...</div>
            </div>
        </div>

        <div class="flex items-center gap-3" id="toolbar">
            <button onclick="loginAdmin()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm flex items-center gap-2 transition shadow-lg shadow-blue-500/20" id="btn-login">
                <i data-lucide="key" class="w-4 h-4"></i> Login Admin
            </button>

            <!-- Admin View -->
            <div id="admin-tools" class="hidden items-center gap-2">
                <!-- Custom Participant Input -->
                <div class="flex items-center gap-2 bg-black/20 border border-white/10 rounded-md px-3 py-1.5" title="Ketik angka bebas (misal 18), sisanya akan jadi BYE">
                    <span class="text-xs font-semibold uppercase tracking-wide">Jml Tim:</span>
                    <input type="number" id="size-input" class="w-12 bg-transparent border-b border-white/30 text-center font-bold outline-none text-sm" min="4" max="64" value="16">
                    <button onclick="changeSize()" class="bg-blue-600 hover:bg-blue-500 text-white p-1 rounded transition">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
                
                <select id="theme-selector" class="bg-black/20 border border-white/10 text-sm font-semibold rounded-md px-3 py-2 outline-none" onchange="changeTheme()">
                    <option value="theme-dark">🌙 Gelap</option>
                    <option value="theme-light">☀️ Terang</option>
                    <option value="theme-blue">🌊 Biru</option>
                    <option value="theme-red">🔥 Merah</option>
                    <option value="theme-emerald">🌲 Hijau</option>
                    <option value="theme-purple">🔮 Ungu</option>
                </select>

                <div class="h-6 w-px bg-white/20 mx-1"></div>

                <button onclick="autoFillNames()" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-500 border border-emerald-600/50 px-3 py-2 rounded-md text-sm flex items-center gap-2 transition font-medium">
                    <i data-lucide="users" class="w-4 h-4"></i> Isi Nama
                </button>
                <button onclick="autoFillScores()" class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-500 border border-amber-600/50 px-3 py-2 rounded-md text-sm flex items-center gap-2 transition font-medium">
                    <i data-lucide="dices" class="w-4 h-4"></i> Acak Skor
                </button>
                <button onclick="resetData()" class="bg-red-600/20 hover:bg-red-600/30 text-red-500 border border-red-600/50 px-3 py-2 rounded-md text-sm flex items-center gap-2 transition font-medium">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Reset
                </button>
                
                <button onclick="logoutAdmin()" class="bg-white/10 hover:bg-white/20 px-3 py-2 rounded-md text-sm transition ml-2">
                    Keluar
                </button>
            </div>
        </div>
    </header>

    <!-- Canvas Bagan -->
    <main class="flex-1 overflow-auto bg-transparent no-scrollbar relative" id="pan-container" style="cursor: grab;">
        <div class="relative p-16 w-max min-w-full h-max min-h-full flex items-center justify-center" id="bracket-container">
            <svg id="svg-lines" class="absolute top-0 left-0 w-full h-full pointer-events-none z-0"></svg>
            <div id="bracket-content" class="flex gap-12 items-center justify-center relative z-10 w-full">
                <!-- Injeksi JS -->
            </div>
        </div>
    </main>

    <!-- Firebase SDK (Versi Compat v8 yang Stabil untuk Single HTML) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        lucide.createIcons();

        // 1. STATE & KONFIGURASI
        let isAdmin = false;
        let svgTimeout;
        
        let tournamentData = {
            title: "Turnamen PES 2026",
            size: 16,        // Ukuran bagan (Kelipatan 2: 4,8,16,32,64)
            actualSize: 16,  // Jumlah tim sebenarnya (Bisa ganjil/genap)
            theme: "theme-dark",
            matches: {}
        };

        // KONFIGURASI FIREBASE ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyA1hCoZklSfmy9ntHFFBvnQk6puBvX6aUI",
            authDomain: "turnamen-bracket-afe1e.firebaseapp.com",
            projectId: "turnamen-bracket-afe1e",
            storageBucket: "turnamen-bracket-afe1e.firebasestorage.app",
            messagingSenderId: "486368316980",
            appId: "1:486368316980:web:dfa97e7a04f8a33e7b4461"
        };

        let db, docRef;

        // 2. INISIALISASI
        window.onload = () => {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                docRef = db.collection('turnamen').doc('data_bagan');

                docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        tournamentData = { ...tournamentData, ...data };
                        
                        if (!tournamentData.matches || Object.keys(tournamentData.matches).length === 0) {
                            generateEmptyMatches(16, 16); // Default jika struktur hancur
                        }
                    } else {
                        generateEmptyMatches(16, 16);
                        saveDataToFirebase(); // Buat pertama kali
                    }

                    applyStateToUI();
                    updateSyncStatus(true);
                }, (error) => {
                    console.error("Firebase Error:", error);
                    updateSyncStatus(false, error.message);
                });

            } catch (error) {
                console.error("Init Error:", error);
                updateSyncStatus(false, "Sistem Gagal Dimuat");
            }

            window.addEventListener('resize', () => {
                clearTimeout(svgTimeout);
                svgTimeout = setTimeout(drawLines, 100);
            });
            setupPanZoom();
        };

        // 3. RENDER UI
        function applyStateToUI() {
            // Update Title (Jangan timpa kalau Admin sedang mengetik)
            const titleInput = document.getElementById('tournament-title');
            if (document.activeElement !== titleInput) {
                titleInput.value = tournamentData.title || "Turnamen PES";
            }
            if(isAdmin) titleInput.removeAttribute('readonly');
            else titleInput.setAttribute('readonly', true);

            // Update Theme & Layout Size
            document.body.className = `h-screen flex flex-col overflow-hidden ${tournamentData.theme || 'theme-dark'}`;
            document.getElementById('theme-selector').value = tournamentData.theme || 'theme-dark';
            
            const sizeInput = document.getElementById('size-input');
            if (document.activeElement !== sizeInput) {
                sizeInput.value = (tournamentData.actualSize || tournamentData.size || 16).toString();
            }

            renderBracketDOM();
            
            // Jeda sejenak untuk menggambar garis (menunggu ukuran flexbox matang)
            clearTimeout(svgTimeout);
            svgTimeout = setTimeout(drawLines, 150);
        }

        function updateTitle(val) {
            if(!isAdmin) return;
            tournamentData.title = val;
            saveDataToFirebase();
        }

        function renderBracketDOM() {
            const container = document.getElementById('bracket-content');
            container.innerHTML = ''; 
            
            const size = parseInt(tournamentData.size) || 16;
            const totalRounds = Math.log2(size);
            
            for (let round = 1; round < totalRounds; round++) {
                container.appendChild(createRoundColumn(round, totalRounds, 'l'));
            }

            container.appendChild(createFinalColumn(totalRounds));

            for (let round = totalRounds - 1; round >= 1; round--) {
                container.appendChild(createRoundColumn(round, totalRounds, 'r'));
            }
        }

        function createRoundColumn(roundNum, totalRounds, side) {
            const col = document.createElement('div');
            col.className = 'flex flex-col gap-6 justify-around h-full';
            
            const size = parseInt(tournamentData.size);
            let matchCountInRound = (size / 2) / Math.pow(2, roundNum - 1);
            
            let roundName = "";
            if (matchCountInRound === 2) roundName = "SEMIFINAL";
            else if (matchCountInRound === 4) roundName = "PEREMPAT FINAL";
            else roundName = `${matchCountInRound * 2} BESAR`;
            
            col.innerHTML = `<div class="text-center text-xs font-bold opacity-50 uppercase tracking-wider mb-2">${roundName} (${side === 'l' ? 'KIRI' : 'KANAN'})</div>`;

            const sideMatches = matchCountInRound / 2; 
            for (let i = 1; i <= sideMatches; i++) {
                const matchId = `r${roundNum}_${side}_${i}`;
                const nextMatchIndex = Math.ceil(i / 2);
                let nextMatchId = (roundNum + 1 === totalRounds) ? 'final' : `r${roundNum + 1}_${side}_${nextMatchIndex}`;

                col.appendChild(createMatchCard(matchId, { id: nextMatchId }, side));
            }
            return col;
        }

        function createFinalColumn() {
            const col = document.createElement('div');
            col.className = 'flex flex-col gap-8 justify-center min-h-full shrink-0 mx-4';
            
            col.innerHTML += `<div class="text-center text-xs font-bold text-amber-500 uppercase tracking-wider mb-0">BABAK FINAL</div>`;
            col.appendChild(createMatchCard('final', null, 'c', true));
            
            col.innerHTML += `<div class="text-center text-xs font-bold opacity-50 uppercase tracking-wider mt-8 mb-0">PEREBUTAN JUARA 3</div>`;
            col.appendChild(createMatchCard('bronze', null, 'c'));
            
            return col;
        }

        function createMatchCard(matchId, nextMatchInfo, side, isFinal = false) {
            if (!tournamentData.matches) return document.createElement('div');
            const match = tournamentData.matches[matchId] || { t1: '', s1: '', t2: '', s2: '' };
            
            const card = document.createElement('div');
            card.id = `card-${matchId}`;
            if (nextMatchInfo) {
                card.dataset.next = `card-${nextMatchInfo.id}`;
                card.dataset.side = side;
            }

            let borderClass = isFinal ? 'border-amber-500 is-final shadow-amber-500/20' : 'bracket-card';
            if (matchId === 'bronze') borderClass = 'bracket-card border-opacity-50';

            const isDone = (match.s1 !== '' && match.s2 !== '' && match.s1 !== match.s2);
            const statusText = isDone ? '<span class="text-emerald-500 font-bold">✓ Selesai</span>' : '<span class="opacity-50">Belum Selesai</span>';
            const titleText = isFinal ? 'FINAL' : (matchId === 'bronze' ? 'JUARA 3' : `Match #${matchId.split('_')[2]}`);

            card.className = `match-card rounded-lg border overflow-hidden shadow-xl transition-all ${borderClass}`;
            
            let html = `
                <div class="bg-black/20 px-3 py-1.5 flex justify-between items-center text-[10px] uppercase font-bold tracking-wider opacity-70 border-b border-inherit">
                    <span>${titleText}</span>
                    <span>${statusText}</span>
                </div>
            `;

            // Hitung Warna Berdasarkan Menang/Kalah
            const t1Win = isDone && parseInt(match.s1) > parseInt(match.s2);
            const t2Win = isDone && parseInt(match.s2) > parseInt(match.s1);

            let name1Color = t1Win ? 'text-emerald-500 font-bold' : (isDone ? 'text-red-500 opacity-60' : '');
            let name2Color = t2Win ? 'text-emerald-500 font-bold' : (isDone ? 'text-red-500 opacity-60' : '');
            let score1Color = t1Win ? 'text-emerald-500 font-bold bg-emerald-500/10' : (isDone ? 'text-red-500 bg-red-500/10' : '');
            let score2Color = t2Win ? 'text-emerald-500 font-bold bg-emerald-500/10' : (isDone ? 'text-red-500 bg-red-500/10' : '');

            // Indikator visual spesial untuk BYE
            if (match.t1 === 'BYE') name1Color = 'opacity-40 italic';
            if (match.t2 === 'BYE') name2Color = 'opacity-40 italic';

            const getReadOnly = () => isAdmin ? '' : 'readonly';
            const getInputClass = (isScore, colorClass) => {
                let base = isScore ? `w-10 h-full text-center outline-none ${colorClass}` : `w-full px-2 text-sm bg-transparent border-none outline-none ${colorClass}`;
                if(isScore && isAdmin) base += " border-l border-inherit admin-bg cursor-text";
                if(isScore && !isAdmin) base += " bg-transparent border-none pointer-events-none";
                return base;
            };

            html += `
                <div class="flex items-stretch border-b border-inherit team-row h-9 transition-colors">
                    <span class="w-5 text-[10px] font-bold opacity-30 flex items-center justify-center shrink-0 border-r border-inherit">1</span>
                    <input type="text" class="${getInputClass(false, name1Color)}" 
                           value="${match.t1}" placeholder="Tim 1" ${getReadOnly()}
                           onchange="updateData('${matchId}', 't1', this.value)">
                    <input type="number" class="${getInputClass(true, score1Color)}" 
                           value="${match.s1}" placeholder="-" ${getReadOnly()}
                           onchange="updateData('${matchId}', 's1', this.value)">
                </div>
                <div class="flex items-stretch team-row h-9 transition-colors">
                    <span class="w-5 text-[10px] font-bold opacity-30 flex items-center justify-center shrink-0 border-r border-inherit">2</span>
                    <input type="text" class="${getInputClass(false, name2Color)}" 
                           value="${match.t2}" placeholder="Tim 2" ${getReadOnly()}
                           onchange="updateData('${matchId}', 't2', this.value)">
                    <input type="number" class="${getInputClass(true, score2Color)}" 
                           value="${match.s2}" placeholder="-" ${getReadOnly()}
                           onchange="updateData('${matchId}', 's2', this.value)">
                </div>
            `;

            card.innerHTML = html;
            return card;
        }

        // 4. MENGGAMBAR GARIS
        function drawLines() {
            const svg = document.getElementById('svg-lines');
            const container = document.getElementById('bracket-container');
            if(!svg || !container) return;
            
            svg.setAttribute('width', container.scrollWidth);
            svg.setAttribute('height', container.scrollHeight);
            svg.innerHTML = ''; 

            const containerRect = container.getBoundingClientRect();
            const cards = document.querySelectorAll('.match-card');
            
            // Pewarnaan dinamis garis berdasarkan tema
            const isLight = tournamentData.theme === 'theme-light';
            let strokeColor = isLight ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.15)'; 

            cards.forEach(card => {
                const nextId = card.dataset.next;
                if (!nextId) return;

                const nextCard = document.getElementById(nextId);
                if (!nextCard) return;

                const side = card.dataset.side; 
                const startRect = card.getBoundingClientRect();
                const endRect = nextCard.getBoundingClientRect();

                let startX, startY, endX, endY;

                // Hitungan posisi presisi mutlak ke dalam SVG Canvas
                if (side === 'l') {
                    startX = (startRect.right - containerRect.left) + container.scrollLeft;
                    endX = (endRect.left - containerRect.left) + container.scrollLeft;
                } else if (side === 'r') {
                    startX = (startRect.left - containerRect.left) + container.scrollLeft;
                    endX = (endRect.right - containerRect.left) + container.scrollLeft;
                } else return;

                startY = (startRect.top - containerRect.top) + container.scrollTop + (startRect.height / 2);
                endY = (endRect.top - containerRect.top) + container.scrollTop + (endRect.height / 2);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const deltaX = Math.abs(endX - startX);
                const controlOffset = deltaX / 2;

                let d = "";
                if (side === 'l') {
                    d = `M ${startX} ${startY} C ${startX + controlOffset} ${startY}, ${endX - controlOffset} ${endY}, ${endX} ${endY}`;
                } else {
                    d = `M ${startX} ${startY} C ${startX - controlOffset} ${startY}, ${endX + controlOffset} ${endY}, ${endX} ${endY}`;
                }

                path.setAttribute('d', d);
                path.setAttribute('class', 'line-path');
                path.setAttribute('stroke', strokeColor);

                svg.appendChild(path);
            });
        }

        // 5. EVENT HANDLERS & LOGIC UPDATE DATA
        function updateData(matchId, field, value) {
            if (!isAdmin) return;
            tournamentData.matches[matchId][field] = value;
            processAutoAdvance(matchId);
            applyStateToUI(); 
            saveDataToFirebase();
        }

        // Auto Advance Rekursif Kuat
        function processAutoAdvance(matchId) {
            const match = tournamentData.matches[matchId];
            if (!match) return;

            const s1 = parseInt(match.s1);
            const s2 = parseInt(match.s2);
            
            let winnerName = '';
            let loserName = '';

            // Jika pertandingan telah dimainkan
            if (!isNaN(s1) && !isNaN(s2) && s1 !== s2) {
                winnerName = s1 > s2 ? match.t1 : match.t2;
                loserName = s1 > s2 ? match.t2 : match.t1;
            }

            if (matchId.startsWith('r')) {
                const parts = matchId.split('_');
                const round = parseInt(parts[0].replace('r', ''));
                const side = parts[1];
                const index = parseInt(parts[2]);
                const totalRounds = Math.log2(parseInt(tournamentData.size));
                
                let nextMatchId = (round + 1 === totalRounds) ? 'final' : `r${round + 1}_${side}_${Math.ceil(index / 2)}`;
                let isSlot1 = (round + 1 === totalRounds) ? (side === 'l') : (index % 2 !== 0);

                if (tournamentData.matches[nextMatchId]) {
                    // Update Pemenang (Walaupun Kosong, agar me-reset babak selanjutnya jika skor dihapus)
                    if (isSlot1) tournamentData.matches[nextMatchId].t1 = winnerName;
                    else tournamentData.matches[nextMatchId].t2 = winnerName;
                    
                    // Rekursi untuk merambat pergantian nama ke final jika skor sudah ada
                    processAutoAdvance(nextMatchId);
                }

                if (nextMatchId === 'final' && tournamentData.matches['bronze']) {
                    if (side === 'l') tournamentData.matches['bronze'].t1 = loserName;
                    else tournamentData.matches['bronze'].t2 = loserName;
                    processAutoAdvance('bronze');
                }
            }
        }

        function saveDataToFirebase() {
            if(!isAdmin || !docRef) return;
            
            updateSyncStatus(false, "Menyimpan...");
            const pureData = JSON.parse(JSON.stringify(tournamentData));
            
            docRef.set(pureData).then(() => {
                updateSyncStatus(true);
            }).catch(error => {
                console.error("Gagal Simpan:", error);
                alert("Gagal Save ke Server: " + error.message);
                updateSyncStatus(false, "Error: Cek Rules Firebase");
            });
        }

        function updateSyncStatus(isSuccess, msg = null) {
            const statusDiv = document.getElementById('sync-status');
            if (isSuccess) {
                statusDiv.innerHTML = '<span class="text-emerald-400 font-medium flex items-center gap-1.5"><i data-lucide="radio" class="w-3.5 h-3.5 animate-pulse"></i> Live Data</span>';
            } else {
                statusDiv.innerHTML = `<span class="text-red-400 font-medium flex items-center gap-1.5"><i data-lucide="wifi-off" class="w-3.5 h-3.5"></i> ${msg || 'Offline'}</span>`;
            }
            lucide.createIcons();
        }

        // 6. FUNGSI ADMIN (Tools & Sistem Kelipatan)
        function generateEmptyMatches(bracketSize, actualSize) {
            tournamentData.matches = {};
            const totalRounds = Math.log2(bracketSize);
            const halfSize = bracketSize / 2;

            if(!actualSize) actualSize = bracketSize;
            let byesCount = bracketSize - actualSize;

            ['l', 'r'].forEach(side => {
                for (let round = 1; round < totalRounds; round++) {
                    const matchCount = halfSize / Math.pow(2, round - 1);
                    for (let i = 1; i <= matchCount; i++) {
                        tournamentData.matches[`r${round}_${side}_${i}`] = { t1: '', s1: '', t2: '', s2: '' };
                    }
                }
            });

            tournamentData.matches['final'] = { t1: '', s1: '', t2: '', s2: '' };
            tournamentData.matches['bronze'] = { t1: '', s1: '', t2: '', s2: '' };

            // Distribusi slot BYE (Mengisi dari urutan atas/bawah agar adil)
            let byeMatches = [];
            for(let i=1; i<=halfSize; i++) {
                byeMatches.push(`r1_l_${i}`);
                byeMatches.push(`r1_r_${i}`);
            }
            
            for(let k=0; k<byesCount; k++) {
                if(byeMatches[k]) {
                    let m = tournamentData.matches[byeMatches[k]];
                    m.t2 = 'BYE';
                    m.s1 = '1';
                    m.s2 = '0';
                }
            }
            
            // Panggil advance agar string kosong T1 maju jika musuhnya BYE
            Object.keys(tournamentData.matches).forEach(id => {
                if(tournamentData.matches[id].t2 === 'BYE') processAutoAdvance(id);
            });
        }

        function changeSize() {
            if(!isAdmin) return;
            const inputVal = parseInt(document.getElementById('size-input').value);
            if(isNaN(inputVal) || inputVal < 2 || inputVal > 64) {
                return alert("Masukkan angka valid antara 2 hingga 64 tim!");
            }

            if(confirm(`Membuat bagan untuk ${inputVal} tim akan MENGHAPUS semua data saat ini. Lanjutkan?`)) {
                tournamentData.actualSize = inputVal;
                
                // Cari angka kelipatan 2 terdekat (4, 8, 16, 32, 64)
                let bSize = 2;
                while (bSize < inputVal) bSize *= 2;
                if (bSize < 4) bSize = 4; // Minimal render grafis
                
                tournamentData.size = bSize;
                
                generateEmptyMatches(bSize, inputVal);
                saveDataToFirebase();
                applyStateToUI();
            } else {
                document.getElementById('size-input').value = tournamentData.actualSize;
            }
        }

        function loginAdmin() {
            const pwd = prompt("Masukkan password Admin:");
            if (pwd === "admin") {
                isAdmin = true;
                document.getElementById('admin-tools').classList.remove('hidden');
                document.getElementById('admin-tools').classList.add('flex');
                document.getElementById('btn-login').classList.add('hidden');
                applyStateToUI();
            } else if (pwd !== null) alert("Password Salah!");
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('admin-tools').classList.add('hidden');
            document.getElementById('admin-tools').classList.remove('flex');
            document.getElementById('btn-login').classList.remove('hidden');
            applyStateToUI();
        }

        function changeTheme() {
            if(!isAdmin) return;
            tournamentData.theme = document.getElementById('theme-selector').value;
            saveDataToFirebase();
            applyStateToUI();
        }

        function resetData() {
            if(!isAdmin) return;
            if(confirm("Hapus semua nama dan skor? (Sistem ukuran tidak berubah)")) {
                generateEmptyMatches(tournamentData.size, tournamentData.actualSize);
                saveDataToFirebase();
                applyStateToUI();
            }
        }

        const teamNamesPool = [
            "Bayern Munchen", "Nusantara FC", "Inter Milan", "AS Roma", 
            "Juventus", "Singa PES", "Persija", "Napoli", "Bhayangkara", 
            "Persib", "Borussia Dortmund", "Real Madrid", "Man United", 
            "Bali United", "Liverpool", "Atletico", "Arsenal", "Chelsea", 
            "Man City", "AC Milan", "PSG", "Barcelona", "Ajax", "Benfica",
            "Tottenham", "Everton", "Lazio", "Fiorentina", "Sevilla", "Valencia"
        ];

        function autoFillNames() {
            if(!isAdmin) return;
            let teamIndex = 0;
            const shuffledNames = [...teamNamesPool].sort(() => 0.5 - Math.random());

            Object.keys(tournamentData.matches).forEach(id => {
                if(id.startsWith('r1_')) {
                    let m = tournamentData.matches[id];
                    if (m.t1 === '' && m.t1 !== 'BYE') m.t1 = shuffledNames[teamIndex++] || `Tim ${teamIndex}`;
                    if (m.t2 === '' && m.t2 !== 'BYE') m.t2 = shuffledNames[teamIndex++] || `Tim ${teamIndex}`;
                    processAutoAdvance(id);
                }
            });
            saveDataToFirebase();
            applyStateToUI();
        }

        function autoFillScores() {
            if(!isAdmin) return;
            let isChanged = false;
            
            Object.keys(tournamentData.matches).forEach(id => {
                const m = tournamentData.matches[id];
                // Jangan ngacak skor kalau musuhnya BYE
                if (m.t1 === 'BYE' || m.t2 === 'BYE') return;

                if (m.t1 !== '' && m.t2 !== '' && m.s1 === '' && m.s2 === '') {
                    let s1 = Math.floor(Math.random() * 5);
                    let s2 = Math.floor(Math.random() * 5);
                    while(s1 === s2) s2 = Math.floor(Math.random() * 5);
                    
                    m.s1 = s1.toString();
                    m.s2 = s2.toString();
                    isChanged = true;
                }
            });

            if (isChanged) {
                Object.keys(tournamentData.matches).forEach(id => processAutoAdvance(id));
                saveDataToFirebase();
                applyStateToUI();
            }
        }

        // 7. DRAG TO PAN CANVAS
        function setupPanZoom() {
            const container = document.getElementById('pan-container');
            let isDown = false;
            let startX, startY, scrollLeft, scrollTop;

            container.addEventListener('mousedown', (e) => {
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
                isDown = true;
                container.style.cursor = 'grabbing';
                startX = e.pageX - container.offsetLeft;
                startY = e.pageY - container.offsetTop;
                scrollLeft = container.scrollLeft;
                scrollTop = container.scrollTop;
            });

            const stopDrag = () => { isDown = false; container.style.cursor = 'grab'; };
            container.addEventListener('mouseleave', stopDrag);
            container.addEventListener('mouseup', stopDrag);

            container.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - container.offsetLeft;
                const y = e.pageY - container.offsetTop;
                container.scrollLeft = scrollLeft - ((x - startX) * 1.5);
                container.scrollTop = scrollTop - ((y - startY) * 1.5);
            });
        }
    </script>
</body>
