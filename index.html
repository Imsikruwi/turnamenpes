<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagan PES Dinamis (4-32) - Kiri Kanan</title>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- jQuery Bracket -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-bracket/0.11.1/jquery.bracket.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-bracket/0.11.1/jquery.bracket.min.js"></script>
    <!-- SheetJS for Excel Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --red: #D32F2F;
            --white: #FFFFFF;
            --dark: #212121;
            --gold: #FFD54F;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #7b0000;
            background-image: radial-gradient(circle, #D32F2F 0%, #7b0000 100%);
            color: var(--white);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            font-weight: 800;
            font-size: 28px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: var(--gold);
        }
        .controls {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
        }
        select, input[type="file"], button {
            padding: 8px 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        select { background: var(--white); color: var(--dark); }
        .file-upload { background: var(--white); color: var(--dark); }
        .btn-action { background: var(--gold); color: var(--dark); }
        .btn-action:hover:not(:disabled) { background: #FFCA28; transform: scale(1.05); }
        .btn-danger { background: #b71c1c; color: white; border: 1px solid white; }
        
        /* Layout Kiri-Kanan */
        .tournament-wrapper {
            display: flex;
            justify-content: center;
            align-items: stretch;
            width: 100%;
            max-width: 1800px;
            overflow-x: auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            min-height: 600px; /* Pastikan ada ruang cukup */
        }
        
        .side-bracket {
            flex: 1;
            min-width: 350px;
        }
        
        .center-bracket {
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Membuat Final di atas, Juara 3 di bawah */
            align-items: center;
            padding: 0 30px;
            min-width: 250px;
            border-left: 2px dashed #ccc;
            border-right: 2px dashed #ccc;
            background: rgba(0,0,0,0.02);
            position: relative;
        }
        
        .final-container { margin-top: 20px; }
        .third-container { margin-top: auto; margin-bottom: 20px; padding-top: 50px;} /* Posisi selalu di bawah */
        
        .center-title {
            color: var(--dark);
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-align: center;
        }
        .center-title.bronze {
            font-size: 20px;
            color: #795548;
        }
        
        /* OVERRIDE CSS UNTUK KONTRAS WARNA TIM */
        .jQBracket { font-family: 'Poppins', sans-serif; }
        .jQBracket .team { 
            background-color: #ffffff !important; /* Latar putih cerah */
            border: 1px solid #999;
            font-weight: 600; 
            font-size: 13px; 
        }
        .jQBracket .team .label { 
            color: #111111 !important; /* Teks sangat gelap (hitam) */
            font-weight: 700;
        }
        .jQBracket .team.na { 
            background-color: #e0e0e0 !important; /* Abu-abu terang jika kosong */
        }
        .jQBracket .team.na .label {
            color: #555555 !important; /* Abu-abu gelap agar tetap terbaca */
        }
        .jQBracket .win { color: #2E7D32 !important; font-weight: 900; }
        .jQBracket .lose { color: #D32F2F !important; }
        .jQBracket .score { font-weight: 800; font-size: 14px; background: #eee !important; color: #111;}
        
        /* Spin Wheel Style */
        #wheelModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        #spinCanvas { border-radius: 50%; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .wheel-pointer { position: absolute; top: 50%; right: -15px; transform: translateY(-50%); width: 0; height: 0; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-right: 30px solid var(--gold); z-index: 10; }
        
    </style>
</head>
<body>

    <div class="header">
        <h1>🏆 Bagan PES - Kiri Kanan 🏆</h1>
    </div>

    <div class="controls">
        <select id="bracketSizeSelector">
            <option value="4">4 Peserta</option>
            <option value="8">8 Peserta</option>
            <option value="16">16 Peserta</option>
            <option value="32" selected>32 Peserta</option>
        </select>
        <label style="font-size: 14px; font-weight: 600;">📁 Import CSV/Excel:</label>
        <input type="file" id="excelUpload" class="file-upload" accept=".xlsx, .xls, .csv">
        
        <button class="btn-action" id="openWheelBtn" disabled style="opacity:0.5; cursor:not-allowed;" onclick="openWheel()">🔒 Klik Bagan Dulu Untuk Spin</button>
        
        <button class="btn-danger" onclick="resetAll()">⚠️ Reset</button>
    </div>

    <div class="tournament-wrapper">
        <!-- Bagan Kiri -->
        <div class="side-bracket" id="bracket-left"></div>
        
        <!-- Bagan Tengah -->
        <div class="center-bracket">
            <div class="final-container">
                <div class="center-title">🥇 FINAL 🥈</div>
                <div id="bracket-final"></div>
                <p style="font-size: 11px; color: #666; text-align: center; margin-top: 10px;">
                    *Klik kotak untuk ketik nama Finalis
                </p>
            </div>
            
            <div class="third-container">
                <div class="center-title bronze">🥉 JUARA 3 🥉</div>
                <div id="bracket-3rd"></div>
            </div>
        </div>

        <!-- Bagan Kanan -->
        <div class="side-bracket" id="bracket-right" style="direction: rtl;"></div>
    </div>

    <!-- Hidden Spin Wheel Modal -->
    <div id="wheelModal">
        <h2 style="margin-bottom: 20px; font-weight: 800; color: white;">UNDIAN TIM / NEGARA</h2>
        <div style="position: relative; width: 400px; height: 400px;">
            <div class="wheel-pointer"></div>
            <canvas id="spinCanvas" width="400" height="400"></canvas>
        </div>
        <div id="wheelResult" style="margin-top: 20px; font-size: 28px; font-weight: 800; color: #FFD54F; text-align: center; height: 40px;">...</div>
        <div style="margin-top: 30px; display: flex; gap: 15px;">
            <button class="btn-action" id="spinBtn" onclick="spinWheel()">SPIN SEKARANG</button>
            <button class="btn-danger" onclick="closeWheel()">Tutup</button>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. DATA INITIALIZATION & DYNAMIC SIZE
        // ----------------------------------------------------
        
        let currentSize = 32;

        function generateEmptyTeams(count, prefix) {
            let teams = [];
            // count = jumlah total di satu sisi. misal size 32 -> sisi 16. jumlah match awal = 8.
            let matches = count / 2;
            if(matches < 1) matches = 1; // Minimal 1 match (2 tim)
            for(let i=1; i<=matches; i++){
                teams.push([prefix + (i*2-1), prefix + (i*2)]);
            }
            return teams;
        }

        let leftData, rightData, finalData, thirdData;

        function loadData(size) {
            currentSize = size;
            let half = size / 2;
            leftData = JSON.parse(localStorage.getItem('pes_dyn_left_'+size)) || { teams: generateEmptyTeams(half, "Kiri "), results: [] };
            rightData = JSON.parse(localStorage.getItem('pes_dyn_right_'+size)) || { teams: generateEmptyTeams(half, "Kanan "), results: [] };
            finalData = JSON.parse(localStorage.getItem('pes_dyn_final_'+size)) || { teams: [["Finalis Kiri", "Finalis Kanan"]], results: [] };
            thirdData = JSON.parse(localStorage.getItem('pes_dyn_third_'+size)) || { teams: [["Loser Kiri", "Loser Kanan"]], results: [] };
        }

        function initBrackets() {
            $('#bracket-left').empty().bracket({
                init: leftData,
                save: function(data) { localStorage.setItem('pes_dyn_left_'+currentSize, JSON.stringify(data)); leftData = data; },
                dir: 'lr', skipConsolationRound: true, disableToolbar: true
            });
            
            $('#bracket-right').empty().bracket({
                init: rightData,
                save: function(data) { localStorage.setItem('pes_dyn_right_'+currentSize, JSON.stringify(data)); rightData = data; },
                dir: 'rl', skipConsolationRound: true, disableToolbar: true
            });
            
            $('#bracket-final').empty().bracket({
                init: finalData,
                save: function(data) { localStorage.setItem('pes_dyn_final_'+currentSize, JSON.stringify(data)); finalData = data; },
                dir: 'lr', skipConsolationRound: true, disableToolbar: true, disableTeamEdit: false
            });
            
            $('#bracket-3rd').empty().bracket({
                init: thirdData,
                save: function(data) { localStorage.setItem('pes_dyn_third_'+currentSize, JSON.stringify(data)); thirdData = data; },
                dir: 'lr', skipConsolationRound: true, disableToolbar: true, disableTeamEdit: false
            });
            
            // Fix text alignment for right bracket because of RTL
            setTimeout(() => {
                $('#bracket-right .team .label').css('text-align', 'right');
            }, 100);
        }

        $(document).ready(function() {
            loadData(currentSize);
            initBrackets();
        });

        $('#bracketSizeSelector').change(function() {
            let newSize = parseInt($(this).val());
            loadData(newSize);
            initBrackets();
        });

        function resetAll() {
            if(confirm("Yakin ingin mereset bagan untuk " + currentSize + " peserta?")) {
                localStorage.removeItem('pes_dyn_left_'+currentSize);
                localStorage.removeItem('pes_dyn_right_'+currentSize);
                localStorage.removeItem('pes_dyn_final_'+currentSize);
                localStorage.removeItem('pes_dyn_third_'+currentSize);
                loadData(currentSize);
                initBrackets();
            }
        }

        // ----------------------------------------------------
        // 2. UNLOCK SPIN WHEEL ON BRACKET CLICK
        // ----------------------------------------------------
        $(document).on('click', '.jQBracket .team', function() {
            $('#openWheelBtn').prop('disabled', false).css({'opacity':'1', 'cursor':'pointer'});
            $('#openWheelBtn').text('🎲 Buka Spin Wheel');
        });

        // ----------------------------------------------------
        // 3. EXCEL IMPORT (SheetJS)
        // ----------------------------------------------------
        document.getElementById('excelUpload').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                var data = new Uint8Array(e.target.result);
                var workbook = XLSX.read(data, {type: 'array'});
                var worksheet = workbook.Sheets[workbook.SheetNames[0]];
                var rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                var names = [];
                
                for(var i=0; i<rows.length; i++) {
                    if(rows[i][0]) names.push(rows[i][0].toString().trim());
                }
                
                if(names.length === 0) { alert("Gagal membaca nama."); return; }
                
                while(names.length < currentSize) { names.push("Kosong"); }
                
                let half = currentSize / 2;
                let newLeftTeams = [];
                for(let i=0; i<half/2; i++) { newLeftTeams.push([names[i*2], names[i*2+1]]); }
                
                let newRightTeams = [];
                let offset = half;
                for(let i=0; i<half/2; i++) { newRightTeams.push([names[offset + i*2], names[offset + i*2+1]]); }

                leftData.teams = newLeftTeams; leftData.results = [];
                rightData.teams = newRightTeams; rightData.results = [];
                
                localStorage.setItem('pes_dyn_left_'+currentSize, JSON.stringify(leftData));
                localStorage.setItem('pes_dyn_right_'+currentSize, JSON.stringify(rightData));
                
                initBrackets();
                alert("Berhasil impor " + names.length + " nama untuk bagan " + currentSize + " peserta!");
            };
            reader.readAsArrayBuffer(file);
        });

        // ----------------------------------------------------
        // 4. SPIN WHEEL SCRIPT
        // ----------------------------------------------------
        const canvas = document.getElementById("spinCanvas");
        const ctx = canvas.getContext("2d");
        const teams = ["Argentina", "France", "Brazil", "England", "Portugal", "Spain", "Germany", "Italy", "Netherlands", "Belgium", "Croatia", "Uruguay"];
        const colors = ["#E53935", "#1E88E5", "#43A047", "#FDD835", "#FFB300", "#8E24AA", "#3949AB", "#00ACC1", "#4CAF50", "#F4511E", "#6D4C41", "#757575"];

        let startAngle = 0; let arc = Math.PI / (teams.length / 2); let spinTimeout = null; let spinAngleStart = 10; let spinTime = 0; let spinTimeTotal = 0;

        function drawWheel() {
            ctx.clearRect(0,0,400,400); ctx.strokeStyle = "black"; ctx.lineWidth = 2; ctx.font = 'bold 16px Poppins, sans-serif';
            for(let i = 0; i < teams.length; i++) {
                let angle = startAngle + i * arc; ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath(); ctx.arc(200, 200, 190, angle, angle + arc, false); ctx.arc(200, 200, 0, angle + arc, angle, true); ctx.fill(); ctx.save();
                ctx.fillStyle = "white"; ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 4;
                ctx.translate(200 + Math.cos(angle + arc / 2) * 135, 200 + Math.sin(angle + arc / 2) * 135); ctx.rotate(angle + arc / 2 + Math.PI);
                let text = teams[i]; ctx.fillText(text, -ctx.measureText(text).width / 2, 0); ctx.restore();
            }
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(200, 200, 25, 0, 2 * Math.PI); ctx.fill();
        }

        function spinWheel() {
            document.getElementById("spinBtn").disabled = true; document.getElementById("wheelResult").innerText = "Mengacak...";
            spinAngleStart = Math.random() * 10 + 10; spinTime = 0; spinTimeTotal = Math.random() * 3000 + 4000; rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if(spinTime >= spinTimeTotal) { stopRotateWheel(); return; }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180); drawWheel(); spinTimeout = requestAnimationFrame(rotateWheel);
        }

        function stopRotateWheel() {
            cancelAnimationFrame(spinTimeout); let degrees = startAngle * 180 / Math.PI + 90; let arcd = arc * 180 / Math.PI;
            let index = Math.floor((360 - degrees % 360) / arcd); let resultIndex = (teams.length - index) % teams.length;
            document.getElementById("wheelResult").innerText = "🎉 " + teams[resultIndex] + " 🎉"; document.getElementById("spinBtn").disabled = false;
        }

        function easeOut(t, b, c, d) { let ts = (t/=d)*t; let tc = ts*t; return b+c*(tc + -3*ts + 3*t); }
        function openWheel() { document.getElementById("wheelModal").style.display = "flex"; drawWheel(); }
        function closeWheel() { document.getElementById("wheelModal").style.display = "none"; document.getElementById("wheelResult").innerText = "..."; }
    </script>
</body>
</html>
