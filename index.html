<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagan Turnamen PES - Live</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0F172A', // Slate 900
                            800: '#1E293B', // Slate 800
                            700: '#334155', // Slate 700
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; overscroll-behavior: none; }
        
        /* Tema Gelap (Default) */
        .theme-dark { background-color: #0F172A; color: #F8FAFC; }
        .theme-dark .bracket-card { background-color: #1E293B; border-color: #334155; }
        .theme-dark .bracket-card:hover { border-color: #475569; }
        .theme-dark .team-row { border-color: #334155; }
        .theme-dark .score-input { background-color: #0F172A; border-color: #334155; color: white; }
        
        /* Tema Biru */
        .theme-blue { background-color: #0c1527; color: #F8FAFC; }
        .theme-blue .bracket-card { background-color: #132442; border-color: #213e73; }
        .theme-blue .bracket-card:hover { border-color: #3058a3; }
        .theme-blue .team-row { border-color: #1a315a; }
        .theme-blue .score-input { background-color: #0c1527; border-color: #213e73; color: white; }
        
        /* Tema Terang */
        .theme-light { background-color: #F8FAFC; color: #0F172A; }
        .theme-light .bracket-card { background-color: white; border-color: #E2E8F0; }
        .theme-light .bracket-card:hover { border-color: #CBD5E1; }
        .theme-light .team-row { border-color: #E2E8F0; }
        .theme-light .score-input { background-color: #F1F5F9; border-color: #CBD5E1; color: #0F172A; }

        .bracket-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            width: max-content;
            min-width: 100%;
            height: max-content;
            min-height: 100%;
        }

        .match-card {
            width: 200px;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 10;
        }

        .team-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* SVG Lines */
        #svg-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .line-path {
            stroke: #475569; /* Warna default */
            stroke-width: 2;
            fill: none;
        }
        
        /* Animasi */
        @keyframes pulse-border {
            0% { border-color: #f59e0b; }
            50% { border-color: #fbbf24; box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
            100% { border-color: #f59e0b; }
        }
        .is-final { animation: pulse-border 2s infinite; }
        
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="theme-dark h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-black/20 backdrop-blur-sm border-b border-white/10 px-6 py-4 flex items-center justify-between shrink-0 z-20 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center shrink-0">
                <i data-lucide="trophy" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <input type="text" id="tournament-title" value="Turnamen PES 2026" class="font-bold text-xl bg-transparent border-none outline-none text-white focus:border-b border-blue-500 w-full" readonly>
                <div class="text-xs text-gray-400 mt-1" id="sync-status">Menghubungkan ke server...</div>
            </div>
        </div>

        <div class="flex items-center gap-3" id="toolbar">
            <!-- Publik View -->
            <div class="bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-md text-sm flex items-center gap-2" id="public-badge">
                <i data-lucide="lock" class="w-4 h-4"></i> Mode Publik (Hanya Lihat)
            </div>
            <button onclick="loginAdmin()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm flex items-center gap-2 transition" id="btn-login">
                <i data-lucide="key" class="w-4 h-4"></i> Login Admin
            </button>

            <!-- Admin View (Hidden by default) -->
            <div id="admin-tools" class="hidden items-center gap-2">
                <select id="size-selector" class="bg-dark-800 border border-dark-700 text-sm rounded-md px-3 py-2 text-white outline-none" onchange="changeSize()">
                    <option value="4">4 Tim (Semifinal)</option>
                    <option value="8">8 Tim (Perempat)</option>
                    <option value="16" selected>16 Tim</option>
                    <option value="32">32 Tim</option>
                </select>
                
                <select id="theme-selector" class="bg-dark-800 border border-dark-700 text-sm rounded-md px-3 py-2 text-white outline-none" onchange="changeTheme()">
                    <option value="theme-dark">Tema Gelap</option>
                    <option value="theme-blue">Tema Biru</option>
                    <option value="theme-light">Tema Terang</option>
                </select>

                <button onclick="autoFillNames()" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-600/50 px-3 py-2 rounded-md text-sm flex items-center gap-2 transition">
                    <i data-lucide="zap" class="w-4 h-4"></i> Isi Nama
                </button>
                <button onclick="autoFillScores()" class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 border border-amber-600/50 px-3 py-2 rounded-md text-sm flex items-center gap-2 transition">
                    <i data-lucide="dices" class="w-4 h-4"></i> Acak Skor
                </button>
                <button onclick="resetData()" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-600/50 px-3 py-2 rounded-md text-sm flex items-center gap-2 transition">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Reset
                </button>
                <button onclick="logoutAdmin()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-2 rounded-md text-sm flex items-center gap-2 transition">
                    Keluar
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content (Pan/Zoom Area) -->
    <main class="flex-1 overflow-auto relative bg-transparent no-scrollbar" id="pan-container" style="cursor: grab;">
        <svg id="svg-lines"></svg>
        <div class="bracket-container" id="bracket-container">
            <!-- Bagan akan di-render di sini oleh JavaScript -->
        </div>
    </main>

    <!-- Firebase SDK Compat (Solid untuk single HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // Inisialisasi Ikon
        lucide.createIcons();

        // -------------------------------------------------------------
        // 1. STATE & FIREBASE CONFIG
        // -------------------------------------------------------------
        let isAdmin = false;
        let isFirstLoad = true;
        let svgTimeout;
        
        // Data Default yang akan digunakan jika database kosong/error
        let tournamentData = {
            title: "Turnamen PES 2026",
            size: 16,
            theme: "theme-dark",
            matches: {} // Akan diisi struktur otomatis
        };

        // KONFIGURASI FIREBASE ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyA1hCoZklSfmy9ntHFFBvnQk6puBvX6aUI",
            authDomain: "turnamen-bracket-afe1e.firebaseapp.com",
            projectId: "turnamen-bracket-afe1e",
            storageBucket: "turnamen-bracket-afe1e.firebasestorage.app",
            messagingSenderId: "486368316980",
            appId: "1:486368316980:web:dfa97e7a04f8a33e7b4461"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // JALUR DATABASE (Sederhana & Genap)
        const docRef = db.collection('turnamen').doc('data_bagan');

        // -------------------------------------------------------------
        // 2. APLIKASI UTAMA (INIT)
        // -------------------------------------------------------------
        async function initApp() {
            try {
                // Wajib Login Anonim agar diizinkan read/write (berdasarkan rule)
                await auth.signInAnonymously();
                
                // Mendengarkan perubahan data secara Real-Time
                docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        // Gabungkan dengan default untuk mencegah properti null
                        tournamentData = { ...tournamentData, ...data };
                        
                        // Jika match kosong dari server, buat strukturnya
                        if (!tournamentData.matches || Object.keys(tournamentData.matches).length === 0) {
                            generateEmptyMatches(tournamentData.size);
                            if(isAdmin) saveDataToFirebase(); // Simpan struktur awal
                        }
                    } else {
                        // Jika belum ada data sama sekali di Firestore (Aman)
                        generateEmptyMatches(tournamentData.size);
                        if(isAdmin) saveDataToFirebase();
                    }

                    // Terapkan ke UI
                    applyStateToUI();
                    updateSyncStatus(true);
                    
                }, (error) => {
                    console.error("Firebase Read Error:", error);
                    updateSyncStatus(false, error.message);
                    
                    // Fallback Offline: Tetap render bagan (kosong) agar UI tidak blank
                    if(isFirstLoad) {
                        generateEmptyMatches(tournamentData.size);
                        applyStateToUI();
                    }
                });

                isFirstLoad = false;

                // Event listener resize window untuk menggambar ulang garis
                window.addEventListener('resize', () => drawLines());
                
                // Event Listener Pan / Drag pada background
                setupPanZoom();

            } catch (error) {
                console.error("Auth/Init Error:", error);
                updateSyncStatus(false, "Gagal Login Anonim");
                
                // Fallback Offline
                generateEmptyMatches(tournamentData.size);
                applyStateToUI();
            }
        }

        // -------------------------------------------------------------
        // 3. RENDER UI & BAGAN
        // -------------------------------------------------------------
        function applyStateToUI() {
            // Update Title
            const titleInput = document.getElementById('tournament-title');
            titleInput.value = tournamentData.title || "Turnamen PES 2026";
            if(isAdmin) {
                titleInput.removeAttribute('readonly');
                titleInput.addEventListener('change', (e) => {
                    tournamentData.title = e.target.value;
                    saveDataToFirebase();
                });
            } else {
                titleInput.setAttribute('readonly', true);
            }

            // Update Theme
            document.body.className = `h-screen flex flex-col overflow-hidden ${tournamentData.theme || 'theme-dark'}`;
            document.getElementById('theme-selector').value = tournamentData.theme || 'theme-dark';
            
            // Update Size selector
            document.getElementById('size-selector').value = (tournamentData.size || 16).toString();

            // Render DOM Bagan
            renderBracketDOM();
            
            // Gambar Garis SVG (Beri jeda agar DOM ter-render dulu)
            clearTimeout(svgTimeout);
            svgTimeout = setTimeout(() => {
                drawLines();
            }, 100);
        }

        function renderBracketDOM() {
            const container = document.getElementById('bracket-container');
            container.innerHTML = ''; // Bersihkan container
            
            const size = parseInt(tournamentData.size) || 16;
            const totalRounds = Math.log2(size); // e.g. size 16 = 4 rounds (incl Final)
            
            const bracketWrapper = document.createElement('div');
            bracketWrapper.className = 'flex gap-12 items-center';

            // --- SAYAP KIRI ---
            for (let round = 1; round < totalRounds; round++) {
                bracketWrapper.appendChild(createRoundColumn(round, totalRounds, 'l'));
            }

            // --- TENGAH (FINAL & JUARA 3) ---
            bracketWrapper.appendChild(createFinalColumn(totalRounds));

            // --- SAYAP KANAN ---
            for (let round = totalRounds - 1; round >= 1; round--) {
                bracketWrapper.appendChild(createRoundColumn(round, totalRounds, 'r'));
            }

            container.appendChild(bracketWrapper);
        }

        function createRoundColumn(roundNum, totalRounds, side) {
            const col = document.createElement('div');
            col.className = 'flex flex-col gap-6 justify-around h-full';
            
            // Header Babak
            const header = document.createElement('div');
            header.className = 'text-center text-xs font-bold text-gray-400 uppercase tracking-wider mb-4';
            
            const size = tournamentData.size;
            let roundName = "";
            let matchCountInRound = (size / 2) / Math.pow(2, roundNum - 1);
            
            if (matchCountInRound === 2) roundName = "SEMIFINAL";
            else if (matchCountInRound === 4) roundName = "PEREMPAT FINAL";
            else roundName = `${matchCountInRound * 2} BESAR`;
            
            header.innerText = `${roundName} (${side === 'l' ? 'KIRI' : 'KANAN'})`;
            col.appendChild(header);

            // Match Cards (Kiri/Kanan)
            const sideMatches = matchCountInRound / 2; // Bagi dua untuk Kiri & Kanan
            for (let i = 1; i <= sideMatches; i++) {
                const matchId = `r${roundNum}_${side}_${i}`;
                
                // Cari tujuan kemana pemenang maju
                const nextMatchIndex = Math.ceil(i / 2);
                let nextMatchId = '';
                if (roundNum + 1 === totalRounds) {
                    nextMatchId = 'final';
                } else {
                    nextMatchId = `r${roundNum + 1}_${side}_${nextMatchIndex}`;
                }

                col.appendChild(createMatchCard(matchId, { id: nextMatchId, slot: i % 2 !== 0 ? 1 : 2 }, side));
            }
            return col;
        }

        function createFinalColumn(totalRounds) {
            const col = document.createElement('div');
            col.className = 'flex flex-col gap-8 justify-center min-h-full shrink-0 mx-8';
            
            // FINAL
            col.innerHTML += `<div class="text-center text-xs font-bold text-amber-500 uppercase tracking-wider mb-2">BABAK FINAL</div>`;
            col.appendChild(createMatchCard('final', null, 'c', true));
            
            // BRONZE (Juara 3)
            col.innerHTML += `<div class="text-center text-xs font-bold text-gray-400 uppercase tracking-wider mt-8 mb-2">PEREBUTAN JUARA 3</div>`;
            col.appendChild(createMatchCard('bronze', null, 'c'));
            
            return col;
        }

        function createMatchCard(matchId, nextMatchInfo, side, isFinal = false) {
            // Aman dari null
            if (!tournamentData.matches) tournamentData.matches = {};
            const match = tournamentData.matches[matchId] || { t1: '', s1: '', t2: '', s2: '' };
            
            const card = document.createElement('div');
            card.id = `card-${matchId}`;
            
            // Atribut data untuk garis SVG
            if (nextMatchInfo) {
                card.dataset.next = `card-${nextMatchInfo.id}`;
                card.dataset.side = side;
            }

            let borderClass = isFinal ? 'border-amber-500 is-final' : 'border-dark-700 bracket-card';
            if (matchId === 'bronze') borderClass = 'border-dark-700 bracket-card';

            const statusText = (match.s1 !== '' && match.s2 !== '' && match.s1 !== match.s2) ? 
                '<span class="text-emerald-400">Selesai</span>' : 
                '<span class="text-gray-500">Belum Selesai</span>';

            const titleText = isFinal ? 'FINAL' : (matchId === 'bronze' ? 'JUARA 3' : `Match #${matchId.split('_')[2]}`);

            card.className = `match-card rounded-lg border bg-dark-800 overflow-hidden shadow-lg transition-colors ${borderClass}`;
            
            let html = `
                <div class="bg-black/20 px-3 py-1.5 flex justify-between items-center text-[10px] uppercase font-bold tracking-wider text-gray-400 border-b border-inherit">
                    <span>${titleText}</span>
                    <span>${statusText}</span>
                </div>
            `;

            // Helper untuk input
            const getReadOnly = () => isAdmin ? '' : 'readonly';
            const getInputClass = (isScore) => {
                let base = isScore ? "w-10 text-center score-input font-bold" : "w-full px-2 text-sm team-name bg-transparent border-none outline-none text-white";
                if(isScore && isAdmin) base += " border rounded bg-dark-900";
                if(isScore && !isAdmin) base += " bg-transparent border-none";
                return base;
            };

            // Tim 1
            const t1Win = match.s1 !== '' && match.s2 !== '' && parseInt(match.s1) > parseInt(match.s2);
            html += `
                <div class="flex items-center px-2 py-1.5 border-b border-inherit team-row">
                    <span class="w-4 text-xs text-gray-500 text-center shrink-0">1</span>
                    <input type="text" class="${getInputClass(false)} ${t1Win ? 'text-amber-400 font-bold' : ''}" 
                           value="${match.t1}" placeholder="Tim 1" ${getReadOnly()}
                           onchange="updateData('${matchId}', 't1', this.value)">
                    <input type="number" class="${getInputClass(true)}" 
                           value="${match.s1}" placeholder="-" ${getReadOnly()}
                           onchange="updateData('${matchId}', 's1', this.value)">
                </div>
            `;

            // Tim 2
            const t2Win = match.s1 !== '' && match.s2 !== '' && parseInt(match.s2) > parseInt(match.s1);
            html += `
                <div class="flex items-center px-2 py-1.5 team-row">
                    <span class="w-4 text-xs text-gray-500 text-center shrink-0">2</span>
                    <input type="text" class="${getInputClass(false)} ${t2Win ? 'text-amber-400 font-bold' : ''}" 
                           value="${match.t2}" placeholder="Tim 2" ${getReadOnly()}
                           onchange="updateData('${matchId}', 't2', this.value)">
                    <input type="number" class="${getInputClass(true)}" 
                           value="${match.s2}" placeholder="-" ${getReadOnly()}
                           onchange="updateData('${matchId}', 's2', this.value)">
                </div>
            `;

            card.innerHTML = html;
            return card;
        }

        // -------------------------------------------------------------
        // 4. MENGGAMBAR GARIS SVG (Konektor)
        // -------------------------------------------------------------
        function drawLines() {
            const svg = document.getElementById('svg-lines');
            const container = document.getElementById('pan-container');
            
            // Set ukuran SVG sama dengan scrollHeight container
            svg.style.width = container.scrollWidth + 'px';
            svg.style.height = container.scrollHeight + 'px';
            svg.innerHTML = ''; // Bersihkan garis lama

            const cards = document.querySelectorAll('.match-card');
            
            cards.forEach(card => {
                const nextId = card.dataset.next;
                if (!nextId) return;

                const nextCard = document.getElementById(nextId);
                if (!nextCard) return;

                const side = card.dataset.side; // 'l' (kiri) atau 'r' (kanan)

                // Dapatkan koordinat relatif terhadap pan-container
                const containerRect = container.getBoundingClientRect();
                const startRect = card.getBoundingClientRect();
                const endRect = nextCard.getBoundingClientRect();

                // Hitung posisi relatif (ditambah scroll position container)
                const scrollLeft = container.scrollLeft;
                const scrollTop = container.scrollTop;

                let startX, startY, endX, endY;

                // Jika sayap kiri, garis keluar dari kanan card
                if (side === 'l') {
                    startX = (startRect.right - containerRect.left) + scrollLeft;
                    endX = (endRect.left - containerRect.left) + scrollLeft;
                } else {
                    // Sayap kanan, garis keluar dari kiri card
                    startX = (startRect.left - containerRect.left) + scrollLeft;
                    endX = (endRect.right - containerRect.left) + scrollLeft;
                }

                // Y selalu berada di tengah card
                startY = (startRect.top - containerRect.top) + (startRect.height / 2) + scrollTop;
                endY = (endRect.top - containerRect.top) + (endRect.height / 2) + scrollTop;

                // Buat garis melengkung (Bezier Curve)
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                
                // Jarak kontrol lengkungan
                const deltaX = Math.abs(endX - startX);
                const controlOffset = deltaX / 2;

                let d = "";
                if (side === 'l') {
                    d = `M ${startX} ${startY} C ${startX + controlOffset} ${startY}, ${endX - controlOffset} ${endY}, ${endX} ${endY}`;
                } else {
                    d = `M ${startX} ${startY} C ${startX - controlOffset} ${startY}, ${endX + controlOffset} ${endY}, ${endX} ${endY}`;
                }

                path.setAttribute('d', d);
                
                // Ambil warna tema
                let strokeColor = '#475569'; // default dark
                if(tournamentData.theme === 'theme-blue') strokeColor = '#213e73';
                if(tournamentData.theme === 'theme-light') strokeColor = '#CBD5E1';

                path.setAttribute('class', 'line-path');
                path.setAttribute('stroke', strokeColor);

                svg.appendChild(path);
            });
        }


        // -------------------------------------------------------------
        // 5. EVENT HANDLERS & LOGIC UPDATE DATA
        // -------------------------------------------------------------
        function updateData(matchId, field, value) {
            if (!isAdmin) return;
            
            // Pastikan data string/number
            tournamentData.matches[matchId][field] = value;
            
            // Cek Auto-Advance (Jika skor berubah)
            if (field === 's1' || field === 's2') {
                processAutoAdvance(matchId);
            }
            
            saveDataToFirebase();
            applyStateToUI(); // Render ulang lokal agar instan sebelum DB membalas
        }

        function processAutoAdvance(matchId) {
            const match = tournamentData.matches[matchId];
            if (!match) return;

            const s1 = parseInt(match.s1);
            const s2 = parseInt(match.s2);
            
            // Pastikan kedua skor diisi dan tidak seri
            if (isNaN(s1) || isNaN(s2) || s1 === s2) return;

            let winnerName = s1 > s2 ? match.t1 : match.t2;
            let loserName = s1 > s2 ? match.t2 : match.t1;
            
            // Cari card di DOM untuk tahu tujuan maju
            const card = document.getElementById(`card-${matchId}`);
            if(!card) return;
            
            const nextMatchId = card.dataset.next ? card.dataset.next.replace('card-', '') : null;
            if(!nextMatchId) return; // Ini Final

            // Menentukan slot di match berikutnya
            // Format ID: r{round}_{side}_{index} => r1_l_1, r1_l_2...
            const parts = matchId.split('_');
            if (parts.length === 3) {
                const currentIndex = parseInt(parts[2]);
                const isSlot1 = currentIndex % 2 !== 0; // Ganjil ke slot 1, Genap ke slot 2
                
                // Set Pemenang ke babak selanjutnya
                if (tournamentData.matches[nextMatchId]) {
                    if (isSlot1) tournamentData.matches[nextMatchId].t1 = winnerName;
                    else tournamentData.matches[nextMatchId].t2 = winnerName;
                }

                // Handle khusus untuk Semifinal (Kalah masuk ke Bronze Match)
                if (nextMatchId === 'final') {
                    const side = parts[1]; // 'l' atau 'r'
                    if (tournamentData.matches['bronze']) {
                        // Kiri masuk slot 1, Kanan masuk slot 2
                        if (side === 'l') tournamentData.matches['bronze'].t1 = loserName;
                        if (side === 'r') tournamentData.matches['bronze'].t2 = loserName;
                    }
                }
            }
        }

        function saveDataToFirebase() {
            if(!isAdmin) return;
            // SetData ke firestore
            docRef.set(tournamentData).catch(error => {
                console.error("Error saving data:", error);
                alert("Gagal menyimpan data: " + error.message);
            });
        }

        function updateSyncStatus(isSuccess, msg = null) {
            const statusDiv = document.getElementById('sync-status');
            if (isSuccess) {
                statusDiv.innerHTML = '<span class="text-emerald-400 flex items-center gap-1"><i data-lucide="wifi" class="w-3 h-3"></i> Live & Tersinkron</span>';
            } else {
                statusDiv.innerHTML = `<span class="text-red-400 flex items-center gap-1"><i data-lucide="wifi-off" class="w-3 h-3"></i> ${msg || 'Offline'}</span>`;
            }
            lucide.createIcons();
        }

        // -------------------------------------------------------------
        // 6. FUNGSI ADMIN (Tools)
        // -------------------------------------------------------------
        function generateEmptyMatches(size) {
            tournamentData.matches = {};
            const totalRounds = Math.log2(size);
            const halfSize = size / 2;

            ['l', 'r'].forEach(side => {
                for (let round = 1; round < totalRounds; round++) {
                    const matchCount = halfSize / Math.pow(2, round - 1);
                    for (let i = 1; i <= matchCount; i++) {
                        tournamentData.matches[`r${round}_${side}_${i}`] = { t1: '', s1: '', t2: '', s2: '' };
                    }
                }
            });

            tournamentData.matches['final'] = { t1: '', s1: '', t2: '', s2: '' };
            tournamentData.matches['bronze'] = { t1: '', s1: '', t2: '', s2: '' };
        }

        function loginAdmin() {
            const pwd = prompt("Masukkan password Admin:");
            if (pwd === "admin") {
                isAdmin = true;
                document.getElementById('admin-tools').classList.remove('hidden');
                document.getElementById('admin-tools').classList.add('flex');
                document.getElementById('btn-login').classList.add('hidden');
                document.getElementById('public-badge').classList.add('hidden');
                applyStateToUI(); // Render ulang agar input bisa diedit
            } else if (pwd !== null) {
                alert("Password Salah!");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('admin-tools').classList.add('hidden');
            document.getElementById('admin-tools').classList.remove('flex');
            document.getElementById('btn-login').classList.remove('hidden');
            document.getElementById('public-badge').classList.remove('hidden');
            applyStateToUI();
        }

        function changeSize() {
            if(!isAdmin) return;
            const newSize = parseInt(document.getElementById('size-selector').value);
            if(confirm(`Mengubah jumlah tim menjadi ${newSize} akan me-reset seluruh bagan. Yakin?`)) {
                tournamentData.size = newSize;
                generateEmptyMatches(newSize);
                saveDataToFirebase();
                applyStateToUI();
            } else {
                document.getElementById('size-selector').value = tournamentData.size;
            }
        }

        function changeTheme() {
            if(!isAdmin) return;
            tournamentData.theme = document.getElementById('theme-selector').value;
            saveDataToFirebase();
            applyStateToUI();
        }

        function resetData() {
            if(!isAdmin) return;
            if(confirm("Hapus semua nama dan skor?")) {
                generateEmptyMatches(tournamentData.size);
                saveDataToFirebase();
                applyStateToUI();
            }
        }

        const teamNamesPool = [
            "Bayern Munchen", "Nusantara United", "Inter Milan", "AS Roma", 
            "Juventus", "Singa PES", "Persija Esports", "Napoli",
            "Bhayangkara PES", "Persib Esports", "Borussia Dortmund", "Real Madrid",
            "Manchester United", "Bali United Esports", "Liverpool FC", "Atletico Madrid",
            "Arsenal", "Chelsea", "Man City", "AC Milan", "PSG", "Barcelona", "Ajax", "Benfica",
            "Porto", "Sporting", "Lazio", "Fiorentina", "Sevilla", "Valencia", "Villareal", "Boca Juniors"
        ];

        function autoFillNames() {
            if(!isAdmin) return;
            const size = tournamentData.size;
            let teamIndex = 0;
            
            // Acak array nama
            const shuffledNames = [...teamNamesPool].sort(() => 0.5 - Math.random());

            ['l', 'r'].forEach(side => {
                const matchCount = (size / 2); // Putaran pertama (Round 1)
                for (let i = 1; i <= matchCount; i++) {
                    const matchId = `r1_${side}_${i}`;
                    if(tournamentData.matches[matchId]) {
                        tournamentData.matches[matchId].t1 = shuffledNames[teamIndex++] || `Tim ${teamIndex}`;
                        tournamentData.matches[matchId].t2 = shuffledNames[teamIndex++] || `Tim ${teamIndex}`;
                    }
                }
            });
            saveDataToFirebase();
            applyStateToUI();
        }

        function autoFillScores() {
            if(!isAdmin) return;
            // Cari pertandingan yang ada namanya tapi belum ada skornya
            Object.keys(tournamentData.matches).forEach(id => {
                const m = tournamentData.matches[id];
                if (m.t1 !== '' && m.t2 !== '' && (m.s1 === '' || m.s2 === '')) {
                    // Beri skor random 0-5
                    let s1 = Math.floor(Math.random() * 5);
                    let s2 = Math.floor(Math.random() * 5);
                    while(s1 === s2) { s2 = Math.floor(Math.random() * 5); } // Hindari seri
                    
                    m.s1 = s1.toString();
                    m.s2 = s2.toString();
                    updateData(id, 's2', m.s2); // Ini akan men-trigger Auto-Advance
                }
            });
        }

        // -------------------------------------------------------------
        // 7. INTERAKSI PAN/DRAG CANVAS (Background)
        // -------------------------------------------------------------
        function setupPanZoom() {
            const container = document.getElementById('pan-container');
            let isDown = false;
            let startX;
            let startY;
            let scrollLeft;
            let scrollTop;

            container.addEventListener('mousedown', (e) => {
                // Jangan pan kalau klik input atau select (biar bisa ngetik)
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                
                isDown = true;
                container.style.cursor = 'grabbing';
                startX = e.pageX - container.offsetLeft;
                startY = e.pageY - container.offsetTop;
                scrollLeft = container.scrollLeft;
                scrollTop = container.scrollTop;
            });

            container.addEventListener('mouseleave', () => {
                isDown = false;
                container.style.cursor = 'grab';
            });

            container.addEventListener('mouseup', () => {
                isDown = false;
                container.style.cursor = 'grab';
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - container.offsetLeft;
                const y = e.pageY - container.offsetTop;
                const walkX = (x - startX) * 2; // Kecepatan scroll x2
                const walkY = (y - startY) * 2;
                container.scrollLeft = scrollLeft - walkX;
                container.scrollTop = scrollTop - walkY;
                
                // Gambar ulang garis saat digeser (untuk SVG absolute positioning correction)
                drawLines();
            });
            
            // Gambar ulang saat di scroll
            container.addEventListener('scroll', () => {
                drawLines();
            });
        }

        // RUN
        window.onload = () => {
            initApp();
        };

    </script>
