<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagan Turnamen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { slate: { 750: '#293548', 850: '#151f32' } },
                    animation: { 'gradient-xy': 'gradient-xy 20s ease infinite', },
                    keyframes: {
                        'gradient-xy': {
                            '0%, 100%': { 'background-size': '400% 400%', 'background-position': 'left center' },
                            '50%': { 'background-size': '200% 200%', 'background-position': 'right center' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; color: #f8fafc; }

        :root {
            --team-font-size: 14px;
        }

        .team-row input[type="text"] {
            font-size: var(--team-font-size) !important;
            line-height: 1.2;
        }

        /* 10 BACKGROUND GRADIENTS */
        @keyframes gradient-xy {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .bg-animated { background-size: 200% 200% !important; animation: gradient-xy 15s ease-in-out infinite !important; }
        .bg-grad-1 { background: linear-gradient(-45deg, #020617, #0f172a, #172554, #052e16, #2e1065); }
        .bg-grad-2 { background: linear-gradient(-45deg, #1a0505, #3f0909, #290000, #4a0404, #000000); }
        .bg-grad-3 { background: linear-gradient(-45deg, #041f2e, #033a4f, #011b2b, #042f3a, #000000); }
        .bg-grad-4 { background: linear-gradient(-45deg, #021a0f, #053b23, #022915, #084a2f, #000000); }
        .bg-grad-5 { background: linear-gradient(-45deg, #120b1f, #2d1b4e, #1a0d33, #3f2273, #05020a); }
        .bg-grad-6 { background: linear-gradient(-45deg, #2e1304, #542204, #361002, #5c2005, #120501); }
        .bg-grad-7 { background: linear-gradient(-45deg, #0f0726, #360c40, #130a38, #451052, #070314); }
        .bg-grad-8 { background: linear-gradient(-45deg, #000000, #0a0a0a, #141414, #1a1a1a, #050505); }
        .bg-grad-9 { background: linear-gradient(-45deg, #1f1805, #3d2f09, #241c03, #4a3a0a, #0a0801); }
        .bg-grad-10 { background: linear-gradient(-45deg, #171c23, #2a3441, #1e252e, #364252, #0b0d12); }
        .bg-grad-11 { background: linear-gradient(-45deg, #475569, #334155, #64748b, #1e293b, #475569); }
        .bg-grad-12 { background: linear-gradient(-45deg, #a16207, #854d0e, #ca8a04, #713f12, #422006); }
        .bg-grad-13 { background: linear-gradient(-45deg, #2563eb, #1d4ed8, #3b82f6, #1e40af, #1e3a8a); }
        .bg-grad-14 { background: linear-gradient(-45deg, #059669, #047857, #10b981, #064e3b, #022c22); }
        .bg-grad-15 { background: linear-gradient(-45deg, #be123c, #9f1239, #e11d48, #831843, #4c0519); }

        /* FLOATING CIRCLES */
        .glass-circle {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 70%);
            animation: float 20s infinite ease-in-out alternate; pointer-events: none; z-index: 1;
        }
        @keyframes float {
            0% { transform: translateY(0) translateX(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-50px) translateX(30px) scale(1.1) rotate(180deg); }
            100% { transform: translateY(20px) translateX(-40px) scale(0.9) rotate(360deg); }
        }

        /* 10 THEMES */
        .bracket-card { background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(10px); border-width: 2px; }
        
        .theme-emerald .bracket-card { border-color: #10b981; }
        .theme-emerald .bracket-card:hover { border-color: #34d399; box-shadow: 0 0 20px rgba(52, 211, 153, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-emerald .line-path.line-active { stroke: #10b981; filter: drop-shadow(0 0 5px rgba(16,185,129,0.7)); }
        
        .theme-red .bracket-card { border-color: #ef4444; }
        .theme-red .bracket-card:hover { border-color: #f87171; box-shadow: 0 0 20px rgba(248, 113, 113, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-red .line-path.line-active { stroke: #ef4444; filter: drop-shadow(0 0 5px rgba(239,68,68,0.7)); }

        .theme-blue .bracket-card { border-color: #3b82f6; }
        .theme-blue .bracket-card:hover { border-color: #60a5fa; box-shadow: 0 0 20px rgba(96, 165, 250, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-blue .line-path.line-active { stroke: #3b82f6; filter: drop-shadow(0 0 5px rgba(59,130,246,0.7)); }

        .theme-purple .bracket-card { border-color: #a855f7; }
        .theme-purple .bracket-card:hover { border-color: #c084fc; box-shadow: 0 0 20px rgba(192, 132, 252, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-purple .line-path.line-active { stroke: #a855f7; filter: drop-shadow(0 0 5px rgba(168,85,247,0.7)); }

        .theme-gold .bracket-card { border-color: #f59e0b; }
        .theme-gold .bracket-card:hover { border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-gold .line-path.line-active { stroke: #f59e0b; filter: drop-shadow(0 0 5px rgba(245,158,11,0.7)); }

        .theme-cyan .bracket-card { border-color: #06b6d4; }
        .theme-cyan .bracket-card:hover { border-color: #22d3ee; box-shadow: 0 0 20px rgba(34, 211, 238, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-cyan .line-path.line-active { stroke: #06b6d4; filter: drop-shadow(0 0 5px rgba(6,182,212,0.7)); }

        .theme-pink .bracket-card { border-color: #ec4899; }
        .theme-pink .bracket-card:hover { border-color: #f472b6; box-shadow: 0 0 20px rgba(244, 114, 182, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-pink .line-path.line-active { stroke: #ec4899; filter: drop-shadow(0 0 5px rgba(236,72,153,0.7)); }

        .theme-orange .bracket-card { border-color: #f97316; }
        .theme-orange .bracket-card:hover { border-color: #fb923c; box-shadow: 0 0 20px rgba(251, 146, 60, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-orange .line-path.line-active { stroke: #f97316; filter: drop-shadow(0 0 5px rgba(249,115,22,0.7)); }

        .theme-silver .bracket-card { border-color: #94a3b8; }
        .theme-silver .bracket-card:hover { border-color: #cbd5e1; box-shadow: 0 0 20px rgba(203, 213, 225, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-silver .line-path.line-active { stroke: #94a3b8; filter: drop-shadow(0 0 5px rgba(148,163,184,0.7)); }

        .theme-neon .bracket-card { border-color: #84cc16; }
        .theme-neon .bracket-card:hover { border-color: #a3e635; box-shadow: 0 0 20px rgba(163, 230, 53, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-neon .line-path.line-active { stroke: #84cc16; filter: drop-shadow(0 0 5px rgba(132,204,22,0.7)); }

        .line-path { stroke-width: 2.5; fill: none; transition: all 0.3s ease; stroke: rgba(148, 163, 184, 0.15); } 
        .match-card { width: 220px; position: relative; z-index: 10; }
        
        .text-winner { color: #fff !important; font-weight: 800 !important; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
        .text-loser { opacity: 0.4 !important; color: #ef4444 !important; }
        .bg-winner { background-color: rgba(255, 255, 255, 0.15) !important; }
        .bg-loser { background-color: rgba(0, 0, 0, 0.3) !important; }

        @keyframes pulse-border {
            0% { border-color: rgba(245, 158, 11, 0.5); transform: scale(1.15); }
            50% { border-color: rgba(251, 191, 36, 1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); transform: scale(1.18); }
            100% { border-color: rgba(245, 158, 11, 0.5); transform: scale(1.15); }
        }
        /* Dihapus margin 1rem 0 pada final agar sejajar sempurna dengan semifinal */
        .is-final { animation: pulse-border 3s infinite; z-index: 15; transform-origin: center; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .animate-tick { display: inline-block; animation: tick 1s steps(1, end) infinite; margin: 0 2px; }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: var(--max-opacity, 0.6); }
            90% { opacity: var(--max-opacity, 0.6); }
            100% { transform: translateY(-110vh) translateX(20px) scale(0.5); opacity: 0; }
        }

        /* PERBAIKAN ANIMASI LENS FLARE */
        @keyframes flarePan {
            0% { left: -50vw; opacity: 0; transform: scale(1) rotate(var(--rot, 0deg)); }
            20% { opacity: var(--max-opacity, 0.4); transform: scale(1.2) rotate(var(--rot, 0deg)); }
            80% { opacity: var(--max-opacity, 0.4); transform: scale(1.2) rotate(var(--rot, 0deg)); }
            100% { left: 150vw; opacity: 0; transform: scale(1) rotate(var(--rot, 0deg)); }
        }

        @keyframes flow-line { to { stroke-dashoffset: -24; } }
        .line-active { stroke-dasharray: 12 12; animation: flow-line 1s linear infinite; }

        @keyframes rouletteSpin {
            0% { transform: translateY(100%); opacity: 0; }
            50% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100%); opacity: 0; }
        }
        .anim-roulette { animation: rouletteSpin 0.15s infinite linear; }
        
        /* EFEK DETAK PADA TITIK DUA JAM */
        @keyframes heartbeatTick {
            0% { transform: scale(1); opacity: 1; }
            15% { transform: scale(1.3); opacity: 0.8; }
            30% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-heartbeat { display: inline-block; animation: heartbeatTick 1s infinite; transform-origin: center; }

        #zoom-wrapper { transition: transform 0.2s ease-out; will-change: transform; transform-origin: center top; }
        
        /* Mengamankan tampilan garis SVG agar merentang penuh */
        #svg-lines {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>

<body id="app-body" class="theme-emerald bg-grad-1 bg-animated h-screen flex flex-col transition-colors duration-700 relative">

    <!-- TEKS LIVE KIRI ATAS -->
    <div class="fixed top-6 left-6 z-[80] flex items-center gap-2.5 pointer-events-none">
        <div class="w-3.5 h-3.5 bg-red-600 rounded-full animate-pulse shadow-[0_0_10px_rgba(220,38,38,0.9)]"></div>
        <span class="text-red-500 font-black tracking-widest text-sm drop-shadow-md uppercase">Live</span>
    </div>

    <!-- PARTICLE CONTAINER (DEBU/BINTANG) -->
    <div id="particles-container" class="fixed inset-0 pointer-events-none z-[1] overflow-hidden"></div>

    <!-- TOGGLE SETTINGS (POJOK KANAN ATAS) -->
    <div id="top-controls" class="fixed top-4 right-4 z-[70] flex flex-col gap-2 pointer-events-auto transition-opacity duration-300">
        <!-- Tombol Layar Penuh -->
        <button onclick="toggleFullscreen()" id="btn-fullscreen" class="bg-black/50 backdrop-blur-md border border-white/20 p-2.5 rounded-full text-white hover:bg-white/10 transition shadow-xl" title="Layar Penuh">
            <i data-lucide="maximize" id="icon-fullscreen" class="w-4 h-4"></i>
        </button>
        <!-- Tombol Fit To Screen -->
        <button onclick="toggleFitToScreen()" id="btn-fit-screen" class="bg-black/50 backdrop-blur-md border border-white/20 p-2.5 rounded-full text-white hover:bg-white/10 transition shadow-xl" title="Paskan Semua Bagan di Layar">
            <i data-lucide="monitor-dot" id="icon-fit-screen" class="w-4 h-4"></i>
        </button>
        <!-- Tombol Pin Header -->
        <button onclick="toggleHeaderShrink()" id="btn-toggle-header" class="bg-black/50 backdrop-blur-md border border-white/20 p-2.5 rounded-full text-white hover:bg-white/10 transition shadow-xl" title="Pin / Unpin Header">
            <i data-lucide="pin" id="icon-header-toggle" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Efek Floating Circles (Animasi Background Latar) -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="glass-circle w-96 h-96 top-[-10%] left-[-10%]"></div>
        <div class="glass-circle w-64 h-64 bottom-[20%] right-[-5%]" style="animation-delay: -5s; animation-duration: 25s;"></div>
        <div class="glass-circle w-72 h-72 top-[30%] left-[40%]" style="animation-delay: -12s; animation-duration: 30s;"></div>
        <div class="glass-circle w-48 h-48 bottom-[-10%] left-[10%]" style="animation-delay: -8s; animation-duration: 18s;"></div>
    </div>

    <!-- Header Fixed -->
    <div id="main-header" class="fixed top-0 left-0 w-full flex flex-col items-center pt-8 pb-6 z-[60] transition-all duration-300 pointer-events-none">
        <input type="text" id="tournament-title" onchange="updateTitle(this.value)" placeholder="Nama Turnamen..." class="font-extrabold text-4xl md:text-5xl text-center bg-transparent border-none outline-none focus:border-b-2 border-white/50 w-[95%] max-w-6xl text-white transition-all pointer-events-auto tracking-tight drop-shadow-2xl" readonly>
        <input type="text" id="tournament-subtitle" onchange="updateSubtitle(this.value)" placeholder="Subjudul Turnamen (Opsional)" class="font-bold text-lg md:text-xl text-center bg-transparent border-none outline-none focus:border-b border-white/30 w-[90%] max-w-5xl text-slate-200 mt-2 transition-all pointer-events-auto drop-shadow-lg" readonly>
        
        <div id="clock-container" class="mt-4 flex flex-col items-center text-white drop-shadow-xl transition-all duration-300">
            <span id="realtime-clock" class="text-5xl md:text-6xl font-black tracking-widest tabular-nums font-mono mb-2 text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-400"><span id="clock-hm">00:00</span><span class="animate-heartbeat text-slate-300 mx-1">:</span><span id="clock-s" class="text-amber-300 drop-shadow-md">00</span></span>
            <span id="realtime-date" class="text-base md:text-lg font-bold tracking-widest uppercase text-slate-300">HARI, TANGGAL BULAN TAHUN</span>
        </div>

        <div id="winner-board" class="hidden mt-6 bg-slate-900/80 backdrop-blur-md border border-amber-500 rounded-2xl p-6 shadow-[0_0_30px_rgba(245,158,11,0.3)] flex-col items-center w-[90%] max-w-md pointer-events-auto transition-all transform scale-95 opacity-0 duration-500 z-40">
            <div class="text-5xl mb-2 filter drop-shadow-lg">🏆</div>
            <div class="text-amber-500 text-xs font-bold tracking-widest uppercase mb-1">JUARA 1 TURNAMEN</div>
            <div id="winner-1" class="text-3xl font-black text-white mb-5 text-center tracking-tight bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-200 text-transparent bg-clip-text drop-shadow-sm">NAMA TIM</div>
            <div class="w-full h-px bg-gradient-to-r from-transparent via-slate-500 to-transparent my-2"></div>
            <div class="flex w-full justify-around items-end pt-3">
                <div class="flex flex-col items-center text-center">
                    <div class="flex items-center gap-1.5 mb-1 text-slate-200">
                        <span class="text-sm filter grayscale drop-shadow">🥈</span><span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Juara 2</span>
                    </div>
                    <div id="winner-2" class="text-base font-bold text-slate-100">TIM DUA</div>
                </div>
                <div class="w-px h-8 bg-slate-600 mx-4"></div>
                <div class="flex flex-col items-center text-center">
                    <div class="flex items-center gap-1.5 mb-1 text-amber-700">
                        <span class="text-sm filter sepia drop-shadow">🥉</span><span class="text-[10px] font-bold uppercase tracking-wider text-amber-600">Juara 3</span>
                    </div>
                    <div id="winner-3" class="text-base font-bold text-slate-200">TIM TIGA</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Area Bagan -->
    <main class="flex-1 overflow-auto bg-transparent no-scrollbar relative w-full h-full z-10 pt-[280px]" id="pan-container" style="cursor: grab;">
        <div id="zoom-wrapper" class="relative p-6 md:p-12 w-max min-w-full h-max mx-auto pb-40 flex flex-col justify-start items-center">
            <!-- bracket-container dibuat absolute position context untuk SVG -->
            <div id="bracket-container" class="relative w-max h-max mt-10">
                <svg id="svg-lines" class="overflow-visible"></svg>
                <div id="bracket-content" class="flex gap-10 md:gap-24 items-center justify-center relative z-10 w-full h-full">
                    <!-- Bagan di-render via JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- TOMBOL TV MODE (Kanan Bawah) -->
    <button onclick="toggleTVMode()" id="btn-tv-mode" class="fixed bottom-4 right-4 bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-full shadow-2xl transition-all hover:scale-110 pointer-events-auto z-[80]" title="TV Mode (Full Screen & Auto Fit)">
        <i data-lucide="tv" class="w-5 h-5"></i>
    </button>

    <!-- Tombol Login Kecil -->
    <button onclick="openLoginModal()" id="btn-login" class="fixed bottom-4 left-4 bg-black/60 backdrop-blur-md border border-white/20 hover:bg-white/10 p-3 rounded-full shadow-2xl text-slate-300 transition-all hover:scale-110 pointer-events-auto z-[80]">
        <i data-lucide="lock" class="w-5 h-5"></i>
    </button>

    <!-- Bottom Bar -->
    <div id="bottom-bar-container" class="fixed bottom-0 left-0 right-0 p-4 flex justify-center items-end z-[70] pointer-events-none transition-opacity duration-300">
        <div id="search-container" class="flex items-center bg-black/60 backdrop-blur-md border border-white/20 rounded-full px-4 py-2.5 w-64 md:w-80 shadow-2xl pointer-events-auto transition-all focus-within:border-white/60 focus-within:ring-2 ring-white/10 relative">
            <i data-lucide="search" class="w-4 h-4 text-slate-300 mr-2.5 shrink-0"></i>
            <input type="text" id="search-input" list="team-list" placeholder="Cari Tim..." oninput="searchTeam(this.value)" class="bg-transparent border-none outline-none text-sm text-white w-full placeholder-slate-400 font-medium">
            <datalist id="team-list"></datalist>
        </div>

        <div class="flex flex-col items-center gap-3 pointer-events-auto w-full max-w-4xl absolute bottom-4">
            <div id="sync-status" class="text-xs bg-black/40 backdrop-blur-sm px-3 py-1.5 rounded-full border border-white/10 shadow-lg absolute right-4 bottom-16 hidden"></div>

            <div class="flex items-center gap-2 justify-center w-full">
                <div id="admin-tools" class="hidden flex-wrap justify-center items-center gap-2 bg-black/70 backdrop-blur-md p-2 rounded-xl border border-white/20 shadow-2xl">
                    
                    <div class="flex items-center gap-1.5 bg-white/5 rounded-lg px-2.5 py-2" title="Jumlah Tim (2-32)">
                        <i data-lucide="users" class="w-4 h-4 text-slate-300"></i>
                        <input type="number" id="size-input" class="w-12 bg-transparent text-center font-bold outline-none text-sm text-white" min="2" max="32" value="16" onkeydown="if(event.key === 'Enter') changeSize()">
                        <button onclick="changeSize()" class="text-emerald-400 hover:text-emerald-300 hover:scale-110 p-1 rounded transition-transform cursor-pointer pointer-events-auto">
                            <i data-lucide="check" class="w-4 h-4"></i>
                        </button>
                    </div>
                    
                    <div class="w-px h-6 bg-white/10 mx-1"></div>

                    <div class="flex items-center gap-1.5 bg-white/5 rounded-lg px-2 py-1.5 border border-white/5" title="Perbesar/Perkecil Nama Peserta">
                        <i data-lucide="type" class="w-4 h-4 text-blue-300"></i>
                        <button onclick="changeFontSize(-1)" class="p-1 text-slate-300 hover:text-white hover:bg-white/10 rounded transition cursor-pointer pointer-events-auto"><i data-lucide="minus" class="w-3 h-3"></i></button>
                        <span id="font-size-disp" class="text-xs font-bold text-white min-w-[20px] text-center">14</span>
                        <button onclick="changeFontSize(1)" class="p-1 text-slate-300 hover:text-white hover:bg-white/10 rounded transition cursor-pointer pointer-events-auto"><i data-lucide="plus" class="w-3 h-3"></i></button>
                    </div>

                    <div class="w-px h-6 bg-white/10 mx-1"></div>

                    <div class="flex items-center gap-1.5 bg-white/5 rounded-lg px-2 py-1.5 border border-white/5" title="Efek Animasi Latar">
                        <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
                        <select id="particle-selector" class="bg-transparent text-xs font-bold outline-none text-white cursor-pointer hover:bg-white/5 transition" onchange="changeParticle()">
                            <option value="none" class="text-black">Efek: Off</option>
                            <option value="star" class="text-black">Bintang</option>
                            <option value="dust" class="text-black">Debu</option>
                            <option value="bubble" class="text-black">Gelembung</option>
                            <option value="lens-flare" class="text-black">Lens Flare</option>
                            <option value="star+flare" class="text-black">Bintang + Flare</option>
                            <option value="dust+flare" class="text-black">Debu + Flare</option>
                            <option value="bubble+flare" class="text-black">Gelembung + Flare</option>
                        </select>
                    </div>

                    <div class="w-px h-6 bg-white/10 mx-1"></div>

                    <select id="bg-selector" class="bg-white/5 border border-white/10 text-xs font-bold rounded-lg px-2 py-2 outline-none text-white cursor-pointer hover:bg-white/10 transition max-w-[100px]" onchange="changeThemeAndBg()">
                        <option value="bg-grad-1" class="text-black">1. Dark</option>
                        <option value="bg-grad-2" class="text-black">2. Blood</option>
                        <option value="bg-grad-3" class="text-black">3. Ocean</option>
                        <option value="bg-grad-4" class="text-black">4. Forest</option>
                        <option value="bg-grad-5" class="text-black">5. Void</option>
                        <option value="bg-grad-6" class="text-black">6. Sunset</option>
                        <option value="bg-grad-7" class="text-black">7. Cyberpunk</option>
                        <option value="bg-grad-8" class="text-black">8. Abyss</option>
                        <option value="bg-grad-9" class="text-black">9. Earth</option>

    <script>
        lucide.createIcons();

        let isAdmin = false;

        let isFitToScreen = false;
        let isTVMode = false;
        let particleIntervals = [];
        let currentParticleType = null;
        let lastWinnerState = false;
        
        let tournamentData = {
            title: "Turnamen Bracket Live", subtitle: "", period: "", size: 16, actualSize: 16,  
            theme: "theme-emerald", bgTheme: "bg-grad-1", particleType: "star",
            locationUrl: "https://maps.app.goo.gl/reHkx6shAXRKqTq99", teamFontSize: 14, matches: {}
        };

        const firebaseConfig = {
            apiKey: "AIzaSyA1hCoZklSfmy9ntHFFBvnQk6puBvX6aUI",
            authDomain: "turnamen-bracket-afe1e.firebaseapp.com",
            projectId: "turnamen-bracket-afe1e",
            storageBucket: "turnamen-bracket-afe1e.firebasestorage.app",
            messagingSenderId: "486368316980",
            appId: "1:486368316980:web:dfa97e7a04f8a33e7b4461"
        };

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep() {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function playWinSound() {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            } catch(e) {}
        }

        document.body.addEventListener('click', () => { initAudio(); }, { once: true });
        document.addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON' || e.target.closest('button')) playBeep(); });

        window.onload = () => {
            initFirebase(); setupPanZoom(); startRealtimeClock(); setupScrollHeaderBehavior();
            window.addEventListener('resize', () => { clearTimeout(svgTimeout); svgTimeout = setTimeout(drawLines, 100); });
        };

        function sanitizeInput(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>"'/]/ig, (match) => {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#x27;', "/": '&#x2F;' };
                return map[match];
            });
        }

        // --- FITUR TV MODE ---
        function toggleTVMode() {
            isTVMode = !isTVMode;
            const btnTV = document.getElementById('btn-tv-mode');
            const bottomBar = document.getElementById('bottom-bar-container');
            const topControls = document.getElementById('top-controls');
            const btnLogin = document.getElementById('btn-login');

            if (isTVMode) {
                // Aktifkan TV Mode
                btnTV.classList.replace('bg-indigo-600', 'bg-rose-600');
                btnTV.classList.replace('hover:bg-indigo-500', 'hover:bg-rose-500');
                btnTV.title = "Keluar TV Mode";
                
                bottomBar.classList.add('opacity-0', 'pointer-events-none');
                topControls.classList.add('opacity-0', 'pointer-events-none');
                if(!isAdmin) btnLogin.classList.add('opacity-0', 'pointer-events-none');

                // Paksa Fullscreen
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.log(e));
                
                // Matikan shrink header
                isHeaderShrinkEnabled = false;
                handleScroll(); // Reset header ke ukuran besar
                
                // Paksa Fit to Screen
                if(!isFitToScreen) {
                    isFitToScreen = true;
                    applyFitToScreenLogic();
                }

            } else {
                // Matikan TV Mode
                btnTV.classList.replace('bg-rose-600', 'bg-indigo-600');
                btnTV.classList.replace('hover:bg-rose-500', 'hover:bg-indigo-500');
                btnTV.title = "TV Mode (Full Screen & Auto Fit)";

                bottomBar.classList.remove('opacity-0', 'pointer-events-none');
                topControls.classList.remove('opacity-0', 'pointer-events-none');
                if(!isAdmin) btnLogin.classList.remove('opacity-0', 'pointer-events-none');
                
                // Keluar Fullscreen
                if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
                
                // Kembalikan shrink header
                isHeaderShrinkEnabled = true;
                handleScroll();

                // Matikan Fit to Screen
                if(isFitToScreen) {
                    isFitToScreen = false;
                    document.getElementById('icon-fit-screen').setAttribute('data-lucide', 'monitor-dot');
                    window.currentScale = 1;
                    applyZoom();
                    setTimeout(() => { centerScroll(); drawLines(); }, 100);
                }
            }
            lucide.createIcons();
        }

        // Dipisahkan agar bisa dipanggil dari TV Mode atau Tombol Manual
        function applyFitToScreenLogic() {
            const panContainer = document.getElementById('pan-container');
            const content = document.getElementById('bracket-container');
            
            window.currentScale = 1;
            applyZoom(); 
            
            setTimeout(() => {
                const viewportWidth = panContainer.clientWidth;
                const viewportHeight = panContainer.clientHeight;
                
                // Ukuran murni (unscaled) dari konten bagan
                const contentWidth = content.offsetWidth;
                const contentHeight = content.offsetHeight + 150; 
                
                const scaleX = (viewportWidth - 80) / contentWidth;
                const scaleY = (viewportHeight - 120) / contentHeight;
                
                window.currentScale = Math.min(scaleX, scaleY, 1.5);
                if(window.currentScale < 0.2) window.currentScale = 0.2; 
                
                applyZoom();
                
                setTimeout(() => {
                    // Pusatkan scroll bar
                    panContainer.scrollLeft = (panContainer.scrollWidth - panContainer.clientWidth) / 2;
                    panContainer.scrollTop = (panContainer.scrollHeight - panContainer.clientHeight) / 2;
                }, 150);
            }, 50);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.log(e));
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        document.addEventListener('fullscreenchange', () => {
            document.getElementById('icon-fullscreen').setAttribute('data-lucide', document.fullscreenElement ? 'minimize' : 'maximize');
            
            // Jika keluar fullscreen lewat tombol ESC, dan sedang mode TV, matikan mode TV
            if (!document.fullscreenElement && isTVMode) {
                toggleTVMode(); 
            }
            lucide.createIcons();
        });

        // Fitur 2: Fit to Screen Toggle
        function toggleFitToScreen() {
            isFitToScreen = !isFitToScreen;
            const icon = document.getElementById('icon-fit-screen');

            if (isFitToScreen) {
                icon.setAttribute('data-lucide', 'zoom-in');
                applyFitToScreenLogic();
            } else {
                icon.setAttribute('data-lucide', 'monitor-dot');
                window.currentScale = 1;
                applyZoom();
                setTimeout(() => { centerScroll(); drawLines(); }, 100);
            }
            lucide.createIcons();
        }

        function toggleHeaderShrink() {
            isHeaderShrinkEnabled = !isHeaderShrinkEnabled;
            document.getElementById('icon-header-toggle').setAttribute('data-lucide', isHeaderShrinkEnabled ? 'pin' : 'pin-off');
            lucide.createIcons(); handleScroll(); 
        }

        function startParticles(type) {
            if (window.particleIntervals) window.particleIntervals.forEach(clearInterval);
            window.particleIntervals = [];
            if (type === 'none') { document.getElementById('particles-container').innerHTML = ''; return; }
            if (type.includes('dust')) window.particleIntervals.push(setInterval(() => createParticle('dust'), 250));
            if (type.includes('bubble')) window.particleIntervals.push(setInterval(() => createParticle('bubble'), 500));
            if (type.includes('star')) window.particleIntervals.push(setInterval(() => createParticle('star'), 400));
            if (type.includes('flare') || type === 'lens-flare') window.particleIntervals.push(setInterval(() => createParticle('lens-flare'), 2500)); // Diperpanjang jeda pembuatannya agar tidak menumpuk
        }

        function createParticle(type) {
            const container = document.getElementById('particles-container');
            if (!container || document.visibilityState !== 'visible') return;
            const p = document.createElement('div'); let size;
            
            if (type === 'lens-flare') {
                size = Math.random() * 500 + 300; 
                p.className = 'absolute pointer-events-none rounded-[100%] blur-sm opacity-0';
                const colors = ['rgba(255,255,255,0.8)', 'rgba(96,165,250,0.5)', 'rgba(251,191,36,0.5)', 'rgba(236,72,153,0.5)'];
                p.style.background = `radial-gradient(ellipse, ${colors[Math.floor(Math.random() * colors.length)]} 0%, transparent 70%)`;
                p.style.width = `${size * 2}px`; p.style.height = `${size / 8}px`;
                p.style.top = `${Math.random() * 80 + 10}vh`; 
                const rot = Math.random() * 40 - 20;
                p.style.setProperty('--rot', `${rot}deg`); // Variabel custom untuk rotasi di keyframes
                p.style.setProperty('--max-opacity', Math.random() * 0.4 + 0.1);
                
                // Durasi acak 6-12 detik agar halus bergeraknya
                const duration = Math.random() * 6 + 6;
                p.style.animation = `flarePan ${duration}s ease-in-out forwards`;
                
                container.appendChild(p); 
                setTimeout(() => { if (p.parentNode) p.remove(); }, duration * 1000 + 500); // Pastikan dihapus
                return; // Return awal untuk flare
            } else if (type === 'bubble') {
                size = Math.random() * 12 + 4; p.className = 'absolute pointer-events-none border border-white/30 rounded-full bg-white/5 backdrop-blur-sm';
            } else if (type === 'dust') {
                size = Math.random() * 4 + 1; p.className = 'absolute pointer-events-none bg-slate-300 rounded-full opacity-60';
            } else {
                size = Math.random() * 4 + 2; p.className = 'absolute pointer-events-none bg-amber-200 shadow-[0_0_5px_#fde047] rounded-full';
            }
            
            if (type !== 'lens-flare') {
                p.style.width = `${size}px`; p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}vw`; p.style.bottom = '-20px';
                p.style.setProperty('--max-opacity', Math.random() * 0.5 + 0.2);
                p.style.animation = `floatUp ${Math.random() * 8 + 6}s linear forwards`;
            }
            container.appendChild(p); setTimeout(() => { if (p.parentNode) p.remove(); }, 20000);
        }

        // Fitur 5: Header Transparan & Blur saat scroll
        function handleScroll() {
            const panContainer = document.getElementById('pan-container');
            const header = document.getElementById('main-header');
            const title = document.getElementById('tournament-title');
            const subtitle = document.getElementById('tournament-subtitle');
            const clockContainer = document.getElementById('clock-container');

            if (isHeaderShrinkEnabled && panContainer.scrollTop > 40) {
                // Mode Kecil: Blur dan transparan untuk hemat tempat dan terlihat elegan
                header.classList.add('bg-black/20', 'backdrop-blur-md', 'border-b', 'border-white/10', 'shadow-sm');
                header.classList.remove('bg-transparent', 'pt-8', 'pb-6');
                header.classList.add('pt-3', 'pb-3');
                
                title.classList.replace('text-4xl', 'text-2xl'); title.classList.replace('md:text-5xl', 'md:text-3xl');
                subtitle.classList.replace('text-lg', 'text-sm'); subtitle.classList.replace('md:text-xl', 'text-sm'); subtitle.classList.replace('mt-2', 'mt-0');
                clockContainer.classList.add('scale-y-0', 'h-0', 'opacity-0'); clockContainer.classList.remove('mt-4');
            } else {
                // Mode Besar: Transparan Penuh tanpa blur, membaur dengan background
                header.classList.remove('bg-black/20', 'backdrop-blur-md', 'border-b', 'border-white/10', 'shadow-sm');
                header.classList.add('bg-transparent', 'pt-8', 'pb-6');
                header.classList.remove('pt-3', 'pb-3');
                
                title.classList.replace('text-2xl', 'text-4xl'); title.classList.replace('md:text-3xl', 'md:text-5xl');
                subtitle.classList.replace('text-sm', 'text-lg'); subtitle.classList.replace('text-sm', 'md:text-xl'); subtitle.classList.replace('mt-0', 'mt-2');
                clockContainer.classList.remove('scale-y-0', 'h-0', 'opacity-0'); clockContainer.classList.add('mt-4');
            }
        }

        function setupScrollHeaderBehavior() { document.getElementById('pan-container').addEventListener('scroll', handleScroll); }

        function startRealtimeClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('clock-hm').innerText = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                document.getElementById('clock-s').innerText = now.getSeconds().toString().padStart(2, '0');
                document.getElementById('realtime-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }, 1000);
        }

        function initFirebase() {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                window.db = firebase.firestore();
                window.db.collection('turnamen').doc('data_bagan').onSnapshot((doc) => {
                    if (doc.exists && doc.data() && Object.keys(doc.data().matches || {}).length > 0) {
                        tournamentData = { ...tournamentData, ...doc.data() };
                    } else generateEmptyMatches(16, 16);
                    applyStateToUI(); updateSyncStatus(true);
                }, () => updateSyncStatus(false, "Terputus"));
            } catch (error) { generateEmptyMatches(16, 16); applyStateToUI(); }
        }

        function applyStateToUI() {
            renderBracketDOM();

            const syncInput = (id, field) => {
                const el = document.getElementById(id); if (!el) return;
                if (document.activeElement !== el) el.value = tournamentData[field] || "";
                if(isAdmin) { el.removeAttribute('readonly'); el.classList.add('cursor-text'); } 
                else { el.setAttribute('readonly', true); el.classList.remove('cursor-text'); }
            };

            syncInput('tournament-title', 'title'); syncInput('tournament-subtitle', 'subtitle');
            
            document.title = tournamentData.title || "Bagan Turnamen";
            document.getElementById('app-body').className = `${tournamentData.theme || 'theme-emerald'} ${tournamentData.bgTheme || 'bg-grad-1'} bg-animated h-screen flex flex-col transition-colors duration-700 relative`;
            document.getElementById('theme-selector').value = tournamentData.theme || 'theme-emerald';
            document.getElementById('bg-selector').value = tournamentData.bgTheme || 'bg-grad-1';
            
            if (document.getElementById('particle-selector')) document.getElementById('particle-selector').value = tournamentData.particleType || 'star';
            
            const sizeInput = document.getElementById('size-input');
            if (document.activeElement !== sizeInput) sizeInput.value = (tournamentData.actualSize || tournamentData.size || 16).toString();

            document.documentElement.style.setProperty('--team-font-size', `${tournamentData.teamFontSize || 14}px`);
            if (document.getElementById('font-size-disp')) document.getElementById('font-size-disp').innerText = tournamentData.teamFontSize || 14;

            if(isAdmin) {
                document.getElementById('btn-login').classList.add('hidden');
                document.getElementById('search-container').classList.add('hidden');
                document.getElementById('admin-tools').classList.remove('hidden'); document.getElementById('admin-tools').classList.add('flex');
            } else {
                document.getElementById('btn-login').classList.remove('hidden');
                document.getElementById('search-container').classList.remove('hidden');
                document.getElementById('admin-tools').classList.add('hidden'); document.getElementById('admin-tools').classList.remove('flex');
            }

            const pType = tournamentData.particleType || 'star';
            if (currentParticleType !== pType) { currentParticleType = pType; startParticles(pType); }

        function getOffset(el, relativeTo) {
            let x = 0, y = 0;
            while (el && el !== relativeTo) {
                x += el.offsetLeft;
                y += el.offsetTop;
                el = el.offsetParent;
            }
            return { x, y };
        }

        function drawLines() {
            const svg = document.getElementById('svg-lines');
            const container = document.getElementById('bracket-container');
            const content = document.getElementById('bracket-content');
            
            if(!svg || !container || !content) return;
            
            // Atur ukuran SVG persis sama dengan ukuran murni dari bracket-content
            svg.style.width = `${content.offsetWidth}px`;
            svg.style.height = `${content.offsetHeight}px`;
            svg.innerHTML = ''; 

            document.querySelectorAll('.match-card').forEach(card => {
                const nextId = card.dataset.next; if (!nextId) return;
                const nextCard = document.getElementById(nextId); if (!nextCard) return;

                const side = card.dataset.side; 
                
                // Gunakan properti offset relative terhadap bracket-content
                // Ini akan mengabaikan pengaruh transform: scale() dari zoom-wrapper
                const startPos = getOffset(card, content);
                const endPos = getOffset(nextCard, content);

                // Ukuran dimensi kotak (offsetWidth tidak terpengaruh scale)
                const startWidth = card.offsetWidth;
                const startHeight = card.offsetHeight;
                const endWidth = nextCard.offsetWidth;
                const endHeight = nextCard.offsetHeight;

                let startX, startY, endX, endY;
                const isActive = card.dataset.winner !== undefined;
                let strokeClass = isActive ? 'line-path line-active' : 'line-path';
                if (nextId === 'bronze') strokeClass = 'line-path'; 

                if (side === 'l') { 
                    startX = startPos.x + startWidth;
                    endX = endPos.x;
                } else if (side === 'r') { 
                    startX = startPos.x;
                    endX = endPos.x + endWidth;
                } else return;

                startY = startPos.y + (startHeight / 2);
                endY = endPos.y + (endHeight / 2);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                // Mid point control line
                const midX = startX + (side==='l'?1:-1)*(Math.abs(endX-startX)/2);
                
                path.setAttribute('d', `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`);
                path.setAttribute('class', strokeClass);
                svg.appendChild(path);
            });
        }

        function updateData(matchId, field, value) {
            if (!isAdmin || !tournamentData.matches[matchId]) return;
            tournamentData.matches[matchId][field] = sanitizeInput(value);
            processAutoAdvance(matchId); applyStateToUI(); saveDataToFirebase();
        }

        function processAutoAdvance(matchId) {
            const match = tournamentData.matches[matchId]; if (!match) return;
            const s1 = parseInt(match.s1); const s2 = parseInt(match.s2);
            let winnerName = '', loserName = '';

            if (!isNaN(s1) && !isNaN(s2) && s1 !== s2) { winnerName = s1 > s2 ? match.t1 : match.t2; loserName = s1 > s2 ? match.t2 : match.t1; } 
            else if (match.t1 === 'BYE' && match.t2 !== '' && match.t2 !== 'BYE') { winnerName = match.t2; } 
            else if (match.t2 === 'BYE' && match.t1 !== '' && match.t1 !== 'BYE') { winnerName = match.t1; }

            if (matchId.startsWith('r')) {
                const parts = matchId.split('_'); const round = parseInt(parts[0].replace('r', '')); const side = parts[1]; const index = parseInt(parts[2]);
                const totalRounds = Math.log2(parseInt(tournamentData.size));
                let nextId = (round + 1 === totalRounds) ? 'final' : `r${round + 1}_${side}_${Math.ceil(index / 2)}`;
                let isSlot1 = (round + 1 === totalRounds) ? (side === 'l') : (index % 2 !== 0);

                if (tournamentData.matches[nextId]) {
                    if (isSlot1) tournamentData.matches[nextId].t1 = winnerName; else tournamentData.matches[nextId].t2 = winnerName;
                    processAutoAdvance(nextId);
                }

                if (nextId === 'final' && tournamentData.matches['bronze'] && loserName !== '' && loserName !== 'BYE') {
                    if (side === 'l') tournamentData.matches['bronze'].t1 = loserName; else tournamentData.matches['bronze'].t2 = loserName;
                    processAutoAdvance('bronze');
                }
            }
        }

        function generateEmptyMatches(bracketSize, actualSize) {
            tournamentData.matches = {}; const totalRounds = Math.log2(bracketSize); const halfSize = bracketSize / 2;
            ['l', 'r'].forEach(side => {
                for (let round = 1; round < totalRounds; round++) {
                    for (let i = 1; i <= (halfSize / Math.pow(2, round - 1)); i++) tournamentData.matches[`r${round}_${side}_${i}`] = { t1: '', s1: '', t2: '', s2: '', time: '' };
                }
            });
            tournamentData.matches['final'] = { t1: '', s1: '', t2: '', s2: '', time: '' }; tournamentData.matches['bronze'] = { t1: '', s1: '', t2: '', s2: '', time: '' };

            let byesCount = bracketSize - actualSize; let sortedR1 = [];
            for(let i=1; i<=halfSize; i++) { sortedR1.push(`r1_l_${i}`); sortedR1.push(`r1_r_${i}`); }
            for(let k=0; k<byesCount; k++) { if(sortedR1[k]) { let m = tournamentData.matches[sortedR1[k]]; m.t2 = 'BYE'; m.s1 = '1'; m.s2 = '0'; } }
            Object.keys(tournamentData.matches).forEach(id => { if(tournamentData.matches[id].t2 === 'BYE') processAutoAdvance(id); });
        }

        function saveBulkModal() {
            if(!isAdmin) return;
            const lines = document.getElementById('bulk-textarea').value.split('\n').map(t => sanitizeInput(t.trim())).filter(t => t.length > 0);
            if(lines.length === 0) return closeBulkModal();
            let r1Slots = []; const half = tournamentData.size / 2;
            for(let i=1; i<=half; i++) {
                let keyL = `r1_l_${i}`; if(tournamentData.matches[keyL].t1 !== 'BYE') r1Slots.push({key: keyL, slot: 't1'});
                let keyR = `r1_r_${i}`; if(tournamentData.matches[keyR].t1 !== 'BYE') r1Slots.push({key: keyR, slot: 't1'});
                if(tournamentData.matches[keyL].t2 !== 'BYE') r1Slots.push({key: keyL, slot: 't2'});
                if(tournamentData.matches[keyR].t2 !== 'BYE') r1Slots.push({key: keyR, slot: 't2'});
            }
            r1Slots.forEach((info, idx) => { if(lines[idx] !== undefined) { tournamentData.matches[info.key][info.slot] = lines[idx]; processAutoAdvance(info.key); } });
            closeBulkModal(); saveDataToFirebase(); applyStateToUI();
        }

        function shuffleTeams() {
            if(!isAdmin) return;
            if(!confirm("Acak posisi tim ronde 1 (dan Reset skor)?")) return;
            let currentTeams = [];
            Object.keys(tournamentData.matches).forEach(k => {
                if(k.startsWith('r1_')) {
                    let m = tournamentData.matches[k];
                    if(m.t1 && m.t1 !== 'BYE') currentTeams.push(m.t1); if(m.t2 && m.t2 !== 'BYE') currentTeams.push(m.t2);
                }
            });

            Object.keys(tournamentData.matches).forEach(k => {
                let m = tournamentData.matches[k];
                if (m.t1 !== 'BYE' && m.t2 !== 'BYE') { m.s1 = ''; m.s2 = ''; }
                if (!k.startsWith('r1_')) { m.t1 = ''; m.t2 = ''; } 
            });

            if (audioCtx && audioCtx.state !== 'suspended') {
                try {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 1.5);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
                    osc.start(); osc.stop(audioCtx.currentTime + 1.5);
                } catch(e) {}
            }

            applyStateToUI();
            setTimeout(() => {
                document.querySelectorAll('.match-card[id^="card-r1_"] .team-row input[type="text"]').forEach(input => {
                    if(!input.value.includes('BYE')) input.classList.add('anim-roulette');
                });
            }, 50);

            setTimeout(() => {
                currentTeams.sort(() => Math.random() - 0.5); let idx = 0; const half = tournamentData.size / 2;
                for(let i=1; i<=half; i++) {
                    let mL = tournamentData.matches[`r1_l_${i}`]; let mR = tournamentData.matches[`r1_r_${i}`];
                    if(mL.t1 !== 'BYE' && currentTeams[idx]) { mL.t1 = currentTeams[idx++]; processAutoAdvance(`r1_l_${i}`); }
                    if(mR.t1 !== 'BYE' && currentTeams[idx]) { mR.t1 = currentTeams[idx++]; processAutoAdvance(`r1_r_${i}`); }
                    if(mL.t2 !== 'BYE' && currentTeams[idx]) { mL.t2 = currentTeams[idx++]; processAutoAdvance(`r1_l_${i}`); }
                    if(mR.t2 !== 'BYE' && currentTeams[idx]) { mR.t2 = currentTeams[idx++]; processAutoAdvance(`r1_r_${i}`); }
                }
                saveDataToFirebase(); applyStateToUI();
            }, 1500);
        }

        const teamPool = ["RRQ", "Evos", "Onic", "Alter Ego", "BTR", "Geek Fam", "Aura", "Rebellion", "T1", "Navi", "Fnatic", "Paper Rex"];
        function autoFillNames() {
            if(!isAdmin) return;
            let pPool = [...teamPool].sort(() => 0.5 - Math.random()); let tIdx = 0;
            Object.keys(tournamentData.matches).forEach(id => {
                if(id.startsWith('r1_')) {
                    let m = tournamentData.matches[id];
                    if (m.t1 === '' && m.t1 !== 'BYE') { m.t1 = pPool[tIdx % pPool.length]; tIdx++; processAutoAdvance(id); }
                    if (m.t2 === '' && m.t2 !== 'BYE') { m.t2 = pPool[tIdx % pPool.length]; tIdx++; processAutoAdvance(id); }
                }
            });
            saveDataToFirebase(); applyStateToUI();
        }

        function autoFillScores() {
            if(!isAdmin) return;
            let isChanged = false;
            Object.keys(tournamentData.matches).forEach(id => {
                const m = tournamentData.matches[id];
                if (m.t1 === 'BYE' || m.t2 === 'BYE') return;
                if (m.t1 !== '' && m.t2 !== '' && m.s1 === '' && m.s2 === '') {
                    let s1 = Math.floor(Math.random() * 4); let s2 = Math.floor(Math.random() * 4);
                    while(s1 === s2) s2 = Math.floor(Math.random() * 4);
                    m.s1 = s1.toString(); m.s2 = s2.toString(); isChanged = true;
                }
            });
            if (isChanged) { Object.keys(tournamentData.matches).forEach(id => processAutoAdvance(id)); saveDataToFirebase(); applyStateToUI(); }
        }

        function updateDatalist() {
            let allTeams = new Set();
            Object.values(tournamentData.matches).forEach(m => {
                if(m.t1 && m.t1 !== 'BYE') allTeams.add(m.t1); if(m.t2 && m.t2 !== 'BYE') allTeams.add(m.t2);
            });
            const datalist = document.getElementById('team-list');
            if (datalist) datalist.innerHTML = Array.from(allTeams).map(t => `<option value="${t}">`).join('');
        }

        window.currentScale = 1;
        function applyZoom() {
            const zoomWrapper = document.getElementById('zoom-wrapper');
            zoomWrapper.style.transform = `scale(${window.currentScale})`;
            
            // Pastikan gambar diulang setiap ada perubahan skala
            // timeout memastikan animasi scale CSS berjalan/selesai dirender
            setTimeout(() => {
                drawLines();
            }, 50);
        }

        function setupPanZoom() {
            const container = document.getElementById('pan-container');
            let isDown = false; let startX, startY, scrollLeft, scrollTop;

            container.addEventListener('mousedown', (e) => {
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                isDown = true; container.style.cursor = 'grabbing';
                startX = e.pageX - container.offsetLeft; startY = e.pageY - container.offsetTop;
                scrollLeft = container.scrollLeft; scrollTop = container.scrollTop;
            });
            const stopDrag = () => { isDown = false; container.style.cursor = 'grab'; };
            container.addEventListener('mouseleave', stopDrag); container.addEventListener('mouseup', stopDrag);
            container.addEventListener('mousemove', (e) => {
                if (!isDown) return; e.preventDefault();
                container.scrollLeft = scrollLeft - ((e.pageX - container.offsetLeft) - startX);
                container.scrollTop = scrollTop - ((e.pageY - container.offsetTop) - startY);
            });

            container.addEventListener('wheel', (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    // Matikan auto-fit jika user melakukan zoom manual
                    if(isFitToScreen) { isFitToScreen = false; document.getElementById('icon-fit-screen').setAttribute('data-lucide', 'scan'); lucide.createIcons(); }
                    const delta = e.deltaY > 0 ? -0.1 : 0.1;
                    window.currentScale = Math.min(Math.max(0.3, window.currentScale + delta), 2.0);
                    applyZoom();
                }
            }, { passive: false });

            let initialDistance = null; let initialScale = 1; let lastTouchX = null, lastTouchY = null;

            container.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                if (e.touches.length === 1) {
                    lastTouchX = e.touches[0].pageX; lastTouchY = e.touches[0].pageY;
                    scrollLeft = container.scrollLeft; scrollTop = container.scrollTop;
                } else if (e.touches.length === 2) {
                    initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    initialScale = window.currentScale;
                }
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && lastTouchX !== null) {
                    if (e.target.tagName !== 'INPUT') e.preventDefault(); 
                    container.scrollLeft = scrollLeft - (e.touches[0].pageX - lastTouchX);
                    container.scrollTop = scrollTop - (e.touches[0].pageY - lastTouchY);
                } else if (e.touches.length === 2 && initialDistance !== null) {
                    e.preventDefault();
                    if(isFitToScreen) { isFitToScreen = false; document.getElementById('icon-fit-screen').setAttribute('data-lucide', 'scan'); lucide.createIcons(); }
                    const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    window.currentScale = Math.min(Math.max(0.3, initialScale * (currentDistance / initialDistance)), 2.0);
                    applyZoom();
                }
            }, { passive: false });

            container.addEventListener('touchend', () => { initialDistance = null; lastTouchX = null; lastTouchY = null; });
        }

        async function callGeminiText(prompt, systemPrompt = "Kamu adalah komentator e-sports yang sangat hype dan antusias. Gunakan bahasa gaul Indonesia kekinian, bersemangat, tapi tetap profesional dan tidak bertele-tele.") {
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } };
            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.candidates && result.candidates[0].content) return result.candidates[0].content.parts[0].text;
                return "Maaf, AI sedang mengalami gangguan sinyal. Coba lagi nanti!";
            } catch (e) { return "Terjadi kesalahan sistem saat memanggil AI."; }
        }

        async function generateAITeams() {
            if(!isAdmin) return;
            updateSyncStatus(false, "AI Bekerja..."); let emptyCount = 0;
            Object.keys(tournamentData.matches).forEach(id => {
                if(id.startsWith('r1_')) { let m = tournamentData.matches[id]; if (m.t1 === '' && m.t1 !== 'BYE') emptyCount++; if (m.t2 === '' && m.t2 !== 'BYE') emptyCount++; }
            });
            if (emptyCount === 0) { alert("Tidak ada slot kosong di babak 1."); updateSyncStatus(true); return; }

            const prompt = `Buatkan ${emptyCount} nama tim e-sports yang unik, keren, lucu dan belum pernah ada. HANYA pisahkan dengan koma (,). Jangan tambahkan teks, titik, atau penomoran apapun selain nama-nama tersebut.`;
            const namesText = await callGeminiText(prompt, "Kamu adalah generator nama tim profesional.");
            const names = namesText.split(',').map(n => sanitizeInput(n.trim().replace(/['"]/g, ''))).filter(n => n.length > 0);

            let tIdx = 0;
            Object.keys(tournamentData.matches).forEach(id => {
                if(id.startsWith('r1_')) {
                    let m = tournamentData.matches[id];
                    if (m.t1 === '' && m.t1 !== 'BYE' && names[tIdx]) { m.t1 = names[tIdx++]; }
                    if (m.t2 === '' && m.t2 !== 'BYE' && names[tIdx]) { m.t2 = names[tIdx++]; }
                    processAutoAdvance(id);
                }
            });
            saveDataToFirebase(); applyStateToUI(); updateSyncStatus(true);
        }

        async function generateAICommentary(matchId) {
            const match = tournamentData.matches[matchId];
            if(!match || !match.t1 || !match.t2 || match.t1 === 'BYE' || match.t2 === 'BYE') { alert("Kedua tim harus terisi terlebih dahulu untuk mendapatkan komentar AI!"); return; }

            const modal = document.getElementById('ai-modal'); const textContainer = document.getElementById('ai-text');
            textContainer.innerHTML = '<i data-lucide="loader-2" class="w-8 h-8 animate-spin text-amber-500 mx-auto mb-3"></i><p class="text-xs text-slate-300 animate-pulse font-bold">AI sedang menyusun komentar hype...</p>';
            lucide.createIcons(); modal.classList.remove('hidden');

            let scoreContext = (match.s1 !== '' && match.s2 !== '') ? `Skor sementara adalah ${match.t1} [${match.s1}] - [${match.s2}] ${match.t2}.` : `Pertandingan ini baru saja akan dimulai atau belum ada skor.`;
            const matchTitle = matchId === 'final' ? "Babak Grand Final" : (matchId === 'bronze' ? "Perebutan Juara 3" : "Fase Gugur");

            const prompt = `Berikan komentar singkat (maksimal 2 kalimat) yang sangat hype, seru, dan menegangkan untuk pertandingan e-sports ${matchTitle} antara tim "${match.t1}" melawan tim "${match.t2}". ${scoreContext}`;
            const responseText = await callGeminiText(prompt);
            textContainer.innerHTML = `<p class="text-[15px] text-white leading-relaxed italic font-medium text-center">"${sanitizeInput(responseText)}"</p>`;
        }

        window.closeAIModal = function() { document.getElementById('ai-modal').classList.add('hidden'); };

    </script>
