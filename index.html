<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagan Turnamen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { slate: { 750: '#293548', 850: '#151f32' } },
                    animation: { 'gradient-xy': 'gradient-xy 20s ease infinite', },
                    keyframes: {
                        'gradient-xy': {
                            '0%, 100%': { 'background-size': '400% 400%', 'background-position': 'left center' },
                            '50%': { 'background-size': '200% 200%', 'background-position': 'right center' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; color: #f8fafc; }

        :root {
            --team-font-size: 14px;
        }

        .team-row input[type="text"] {
            font-size: var(--team-font-size) !important;
            line-height: 1.2;
        }

        /* 10 BACKGROUND GRADIENTS */
        @keyframes gradient-xy {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .bg-animated { background-size: 200% 200% !important; animation: gradient-xy 15s ease-in-out infinite !important; }
        .bg-grad-1 { background: linear-gradient(-45deg, #020617, #0f172a, #172554, #052e16, #2e1065); } /* Default Dark */
        .bg-grad-2 { background: linear-gradient(-45deg, #1a0505, #3f0909, #290000, #4a0404, #000000); } /* Blood */
        .bg-grad-3 { background: linear-gradient(-45deg, #041f2e, #033a4f, #011b2b, #042f3a, #000000); } /* Ocean */
        .bg-grad-4 { background: linear-gradient(-45deg, #021a0f, #053b23, #022915, #084a2f, #000000); } /* Forest */
        .bg-grad-5 { background: linear-gradient(-45deg, #120b1f, #2d1b4e, #1a0d33, #3f2273, #05020a); } /* Void */
        .bg-grad-6 { background: linear-gradient(-45deg, #2e1304, #542204, #361002, #5c2005, #120501); } /* Sunset */
        .bg-grad-7 { background: linear-gradient(-45deg, #0f0726, #360c40, #130a38, #451052, #070314); } /* Cyberpunk */
        .bg-grad-8 { background: linear-gradient(-45deg, #000000, #0a0a0a, #141414, #1a1a1a, #050505); } /* Abyss */
        .bg-grad-9 { background: linear-gradient(-45deg, #1f1805, #3d2f09, #241c03, #4a3a0a, #0a0801); } /* Earth */
        .bg-grad-10 { background: linear-gradient(-45deg, #171c23, #2a3441, #1e252e, #364252, #0b0d12); }/* Phantom */

        /* FLOATING CIRCLES ANIMATION */
        .glass-circle {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 70%);
            animation: float 20s infinite ease-in-out alternate; pointer-events: none; z-index: 1;
        }
        @keyframes float {
            0% { transform: translateY(0) translateX(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-50px) translateX(30px) scale(1.1) rotate(180deg); }
            100% { transform: translateY(20px) translateX(-40px) scale(0.9) rotate(360deg); }
        }

        /* 10 THEMES FOR BRACKET CARDS (Border, Hover, Glow) */
        .bracket-card { background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(10px); border-width: 2px; }
        
        /* 1. Emerald */
        .theme-emerald .bracket-card { border-color: #10b981; }
        .theme-emerald .bracket-card:hover { border-color: #34d399; box-shadow: 0 0 20px rgba(52, 211, 153, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-emerald .line-path.line-active { stroke: #10b981; filter: drop-shadow(0 0 5px rgba(16,185,129,0.7)); }
        
        /* 2. Red */
        .theme-red .bracket-card { border-color: #ef4444; }
        .theme-red .bracket-card:hover { border-color: #f87171; box-shadow: 0 0 20px rgba(248, 113, 113, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-red .line-path.line-active { stroke: #ef4444; filter: drop-shadow(0 0 5px rgba(239,68,68,0.7)); }

        /* 3. Blue */
        .theme-blue .bracket-card { border-color: #3b82f6; }
        .theme-blue .bracket-card:hover { border-color: #60a5fa; box-shadow: 0 0 20px rgba(96, 165, 250, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-blue .line-path.line-active { stroke: #3b82f6; filter: drop-shadow(0 0 5px rgba(59,130,246,0.7)); }

        /* 4. Purple */
        .theme-purple .bracket-card { border-color: #a855f7; }
        .theme-purple .bracket-card:hover { border-color: #c084fc; box-shadow: 0 0 20px rgba(192, 132, 252, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-purple .line-path.line-active { stroke: #a855f7; filter: drop-shadow(0 0 5px rgba(168,85,247,0.7)); }

        /* 5. Gold */
        .theme-gold .bracket-card { border-color: #f59e0b; }
        .theme-gold .bracket-card:hover { border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-gold .line-path.line-active { stroke: #f59e0b; filter: drop-shadow(0 0 5px rgba(245,158,11,0.7)); }

        /* 6. Cyan */
        .theme-cyan .bracket-card { border-color: #06b6d4; }
        .theme-cyan .bracket-card:hover { border-color: #22d3ee; box-shadow: 0 0 20px rgba(34, 211, 238, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-cyan .line-path.line-active { stroke: #06b6d4; filter: drop-shadow(0 0 5px rgba(6,182,212,0.7)); }

        /* 7. Pink */
        .theme-pink .bracket-card { border-color: #ec4899; }
        .theme-pink .bracket-card:hover { border-color: #f472b6; box-shadow: 0 0 20px rgba(244, 114, 182, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-pink .line-path.line-active { stroke: #ec4899; filter: drop-shadow(0 0 5px rgba(236,72,153,0.7)); }

        /* 8. Orange */
        .theme-orange .bracket-card { border-color: #f97316; }
        .theme-orange .bracket-card:hover { border-color: #fb923c; box-shadow: 0 0 20px rgba(251, 146, 60, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-orange .line-path.line-active { stroke: #f97316; filter: drop-shadow(0 0 5px rgba(249,115,22,0.7)); }

        /* 9. Silver */
        .theme-silver .bracket-card { border-color: #94a3b8; }
        .theme-silver .bracket-card:hover { border-color: #cbd5e1; box-shadow: 0 0 20px rgba(203, 213, 225, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-silver .line-path.line-active { stroke: #94a3b8; filter: drop-shadow(0 0 5px rgba(148,163,184,0.7)); }

        /* 10. Neon */
        .theme-neon .bracket-card { border-color: #84cc16; }
        .theme-neon .bracket-card:hover { border-color: #a3e635; box-shadow: 0 0 20px rgba(163, 230, 53, 0.5); transform: scale(1.03); z-index: 20; }
        .theme-neon .line-path.line-active { stroke: #84cc16; filter: drop-shadow(0 0 5px rgba(132,204,22,0.7)); }

        /* Utility Lines */
        .line-path { stroke-width: 2.5; fill: none; transition: all 0.3s ease; stroke: rgba(148, 163, 184, 0.15); } 
        .match-card { width: 220px; margin-bottom: 1.5rem; position: relative; z-index: 10; }
        
        .text-winner { color: #fff !important; font-weight: 800 !important; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
        .text-loser { opacity: 0.4 !important; color: #ef4444 !important; }
        .bg-winner { background-color: rgba(255, 255, 255, 0.15) !important; }
        .bg-loser { background-color: rgba(0, 0, 0, 0.3) !important; }

        @keyframes pulse-border {
            0% { border-color: rgba(245, 158, 11, 0.5); }
            50% { border-color: rgba(251, 191, 36, 1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); transform: scale(1.02); }
            100% { border-color: rgba(245, 158, 11, 0.5); }
        }
        .is-final { animation: pulse-border 3s infinite; z-index: 15; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ANIMASI DETIK JAM */
        @keyframes tick {
            0% { transform: translateY(-5px) scale(1.1); opacity: 0.8; }
            40% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-tick { display: inline-block; animation: tick 1s ease-out infinite; }

        /* ANIMASI DEBU / BINTANG (PARTICLES) */
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: var(--max-opacity, 0.6); }
            90% { opacity: var(--max-opacity, 0.6); }
            100% { transform: translateY(-110vh) translateX(20px) scale(0.5); opacity: 0; }
        }

        /* ANIMASI GARIS MENGALIR (GLOW FLOW DARI A KE B) */
        @keyframes flow-line {
            to { stroke-dashoffset: -24; }
        }
        .line-active {
            stroke-dasharray: 12 12;
            animation: flow-line 1s linear infinite;
        }
    </style>
</head>

<body id="app-body" class="theme-emerald bg-grad-1 bg-animated h-screen flex flex-col transition-colors duration-700 relative">

    <!-- PARTICLE CONTAINER (DEBU/BINTANG) -->
    <div id="particles-container" class="fixed inset-0 pointer-events-none z-[1] overflow-hidden"></div>

    <!-- TOGGLE SETTINGS (POJOK KANAN ATAS) -->
    <div class="fixed top-4 right-4 z-[70] flex flex-col gap-2 pointer-events-auto">
        <button onclick="toggleHeaderShrink()" id="btn-toggle-header" class="bg-black/50 backdrop-blur-md border border-white/20 p-2.5 rounded-full text-white hover:bg-white/10 transition shadow-xl" title="Pin / Unpin Header">
            <i data-lucide="pin" id="icon-header-toggle" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Efek Floating Circles (Animasi Background Latar) -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="glass-circle w-96 h-96 top-[-10%] left-[-10%]"></div>
        <div class="glass-circle w-64 h-64 bottom-[20%] right-[-5%]" style="animation-delay: -5s; animation-duration: 25s;"></div>
        <div class="glass-circle w-72 h-72 top-[30%] left-[40%]" style="animation-delay: -12s; animation-duration: 30s;"></div>
        <div class="glass-circle w-48 h-48 bottom-[-10%] left-[10%]" style="animation-delay: -8s; animation-duration: 18s;"></div>
    </div>

    <!-- Header Fixed: Tidak akan terhalang bagan, menyusut saat discroll -->
    <div id="main-header" class="fixed top-0 left-0 w-full flex flex-col items-center pt-8 pb-6 z-[60] transition-all duration-300 pointer-events-none">
        
        <!-- Judul Turnamen (Bisa sangat panjang) -->
        <input type="text" id="tournament-title" onchange="updateTitle(this.value)" placeholder="Nama Turnamen..." class="font-extrabold text-4xl md:text-5xl text-center bg-transparent border-none outline-none focus:border-b-2 border-white/50 w-[95%] max-w-6xl text-white transition-all pointer-events-auto tracking-tight drop-shadow-lg" readonly>
        
        <!-- Subjudul Turnamen (Bisa sangat panjang) -->
        <input type="text" id="tournament-subtitle" onchange="updateSubtitle(this.value)" placeholder="Subjudul Turnamen (Opsional)" class="font-bold text-lg md:text-xl text-center bg-transparent border-none outline-none focus:border-b border-white/30 w-[90%] max-w-5xl text-slate-300 mt-2 transition-all pointer-events-auto drop-shadow-md" readonly>
        
        <!-- Tanggal & Jam Real-time -->
        <div id="clock-container" class="mt-4 flex flex-col items-center text-white drop-shadow-xl transition-all duration-300">
            <span id="realtime-clock" class="text-5xl md:text-6xl font-black tracking-widest tabular-nums font-mono mb-2 text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-400"><span id="clock-hm">00:00:</span><span id="clock-s" class="animate-tick text-amber-300 drop-shadow-md">00</span></span>
            <span id="realtime-date" class="text-base md:text-lg font-bold tracking-widest uppercase text-slate-300">HARI, TANGGAL BULAN TAHUN</span>
        </div>

        <!-- Papan Juara Otomatis (Muncul saat final selesai) -->
        <div id="winner-board" class="hidden mt-6 bg-slate-900/80 backdrop-blur-md border border-amber-500 rounded-2xl p-6 shadow-[0_0_30px_rgba(245,158,11,0.3)] flex-col items-center w-[90%] max-w-md pointer-events-auto transition-all transform scale-95 opacity-0 duration-500 z-40">
            <div class="text-5xl mb-2 filter drop-shadow-lg">🏆</div>
            <div class="text-amber-500 text-xs font-bold tracking-widest uppercase mb-1">JUARA 1 TURNAMEN</div>
            <div id="winner-1" class="text-3xl font-black text-white mb-5 text-center tracking-tight bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-200 text-transparent bg-clip-text drop-shadow-sm">NAMA TIM</div>
            
            <div class="w-full h-px bg-gradient-to-r from-transparent via-slate-500 to-transparent my-2"></div>
            
            <div class="flex w-full justify-around items-end pt-3">
                <div class="flex flex-col items-center text-center">
                    <div class="flex items-center gap-1.5 mb-1 text-slate-200">
                        <span class="text-sm filter grayscale drop-shadow">🥈</span><span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Juara 2</span>
                    </div>
                    <div id="winner-2" class="text-base font-bold text-slate-100">TIM DUA</div>
                </div>
                <div class="w-px h-8 bg-slate-600 mx-4"></div>
                <div class="flex flex-col items-center text-center">
                    <div class="flex items-center gap-1.5 mb-1 text-amber-700">
                        <span class="text-sm filter sepia drop-shadow">🥉</span><span class="text-[10px] font-bold uppercase tracking-wider text-amber-600">Juara 3</span>
                    </div>
                    <div id="winner-3" class="text-base font-bold text-slate-200">TIM TIGA</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Area Bagan (Dimulai dari bawah header, scroll independen) -->
    <main class="flex-1 overflow-auto bg-transparent no-scrollbar relative w-full h-full z-10 pt-[280px]" id="pan-container" style="cursor: grab;">
        <div id="zoom-wrapper" class="relative p-6 md:p-12 w-max min-w-full h-max mx-auto pb-32 flex flex-col justify-start items-center">
            
            <!-- Kontainer Bagan Inti -->
            <div id="bracket-container" class="relative w-max h-max mt-10">
                <svg id="svg-lines" class="absolute top-0 left-0 pointer-events-none z-0 overflow-visible"></svg>
                <div id="bracket-content" class="flex gap-10 md:gap-24 items-center justify-center relative z-10 w-full h-full">
                    <!-- Bagan di-render via JS -->
                </div>
            </div>

            <!-- Footer Custom (Periode Turnamen) -->
            <div class="mt-20 z-20 pointer-events-auto w-full flex flex-col items-center justify-center gap-4">
                <input type="text" id="tournament-period" onchange="updatePeriod(this.value)" placeholder="Teks Footer / Tanggal Periode Turnamen" class="bg-transparent text-center border-none outline-none hover:border-b focus:border-b border-white/30 text-slate-400 font-bold tracking-widest text-xs md:text-sm w-full max-w-2xl transition-all placeholder-slate-600 uppercase" readonly>
                
                <!-- Link Lokasi Google Maps -->
                <div class="flex items-center gap-2">
                    <a href="https://maps.app.goo.gl/reHkx6shAXRKqTq99" id="location-link" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 text-xs md:text-sm text-blue-300 hover:text-blue-200 transition-all bg-blue-900/30 hover:bg-blue-800/40 px-5 py-2.5 rounded-full border border-blue-500/40 shadow-[0_0_15px_rgba(59,130,246,0.2)]">
                        <i data-lucide="map-pin" class="w-4 h-4"></i> Lokasi Turnamen
                    </a>
                    <button id="btn-edit-location" onclick="editLocationPrompt()" class="hidden bg-black/50 backdrop-blur-md border border-white/20 p-2 rounded-full text-slate-300 hover:text-white transition shadow-lg" title="Edit Link Maps">
                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Bottom Bar (Search di Kiri, Admin Tools di Kanan Bawah) -->
    <div class="fixed bottom-0 left-0 right-0 p-4 flex justify-between items-end z-[70] pointer-events-none">
        
        <!-- KIRI: Pencarian Tim -->
        <div class="flex items-center bg-black/60 backdrop-blur-md border border-white/20 rounded-full px-4 py-2.5 w-64 md:w-80 shadow-2xl pointer-events-auto transition-all focus-within:border-white/60 focus-within:ring-2 ring-white/10 relative">
            <i data-lucide="search" class="w-4 h-4 text-slate-300 mr-2.5 shrink-0"></i>
            <input type="text" id="search-input" list="team-list" placeholder="Cari Tim..." oninput="searchTeam(this.value)" class="bg-transparent border-none outline-none text-sm text-white w-full placeholder-slate-400 font-medium">
            <datalist id="team-list"></datalist>
        </div>

        <!-- KANAN: Panel Admin -->
        <div class="flex flex-col items-end gap-3 pointer-events-auto">
            
            <div id="sync-status" class="text-xs bg-black/40 backdrop-blur-sm px-3 py-1.5 rounded-full border border-white/10 shadow-lg mr-1">
                <!-- Status Sinkronisasi -->
            </div>

            <div class="flex items-center gap-2">
                <!-- Panel Menu Admin (Tersembunyi jika bukan admin) -->
                <div id="admin-tools" class="hidden flex-wrap justify-end items-center gap-2 bg-black/70 backdrop-blur-md p-2 rounded-xl border border-white/20 shadow-2xl max-w-2xl">
                    
                    <!-- Ukuran -->
                    <div class="flex items-center gap-1.5 bg-white/5 rounded-lg px-2.5 py-2" title="Jumlah Tim (2-32)">
                        <i data-lucide="users" class="w-4 h-4 text-slate-300"></i>
                        <input type="number" id="size-input" class="w-12 bg-transparent text-center font-bold outline-none text-sm text-white" min="2" max="32" value="16" onkeydown="if(event.key === 'Enter') changeSize()">
                        <button onclick="changeSize()" class="text-emerald-400 hover:text-emerald-300 hover:scale-110 p-1 rounded transition-transform cursor-pointer pointer-events-auto">
                            <i data-lucide="check" class="w-4 h-4"></i>
                        </button>
                    </div>
                    
                    <div class="w-px h-6 bg-white/10 mx-1"></div>

                    <!-- Ukuran Font Tim (Perbesar/Perkecil) -->
                    <div class="flex items-center gap-1.5 bg-white/5 rounded-lg px-2 py-1.5 border border-white/5" title="Perbesar/Perkecil Nama Peserta">
                        <i data-lucide="type" class="w-4 h-4 text-blue-300"></i>
                        <button onclick="changeFontSize(-1)" class="p-1 text-slate-300 hover:text-white hover:bg-white/10 rounded transition cursor-pointer pointer-events-auto"><i data-lucide="minus" class="w-3 h-3"></i></button>
                        <span id="font-size-disp" class="text-xs font-bold text-white min-w-[20px] text-center">14</span>
                        <button onclick="changeFontSize(1)" class="p-1 text-slate-300 hover:text-white hover:bg-white/10 rounded transition cursor-pointer pointer-events-auto"><i data-lucide="plus" class="w-3 h-3"></i></button>
                    </div>

                    <div class="w-px h-6 bg-white/10 mx-1"></div>

                    <!-- Efek Partikel Selector -->
                    <div class="flex items-center gap-1.5 bg-white/5 rounded-lg px-2 py-1.5 border border-white/5" title="Efek Animasi Latar">
                        <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
                        <select id="particle-selector" class="bg-transparent text-xs font-bold outline-none text-white cursor-pointer hover:bg-white/5 transition" onchange="changeParticle()">
                            <option value="none" class="text-black">Efek: Off</option>
                            <option value="star" class="text-black">Bintang</option>
                            <option value="dust" class="text-black">Debu</option>
                            <option value="bubble" class="text-black">Gelembung</option>
                        </select>
                    </div>

                    <div class="w-px h-6 bg-white/10 mx-1"></div>

                    <!-- 10 Background Selector -->
                    <select id="bg-selector" class="bg-white/5 border border-white/10 text-xs font-bold rounded-lg px-2 py-2 outline-none text-white cursor-pointer hover:bg-white/10 transition max-w-[100px]" onchange="changeThemeAndBg()">
                        <option value="bg-grad-1" class="text-black">1. Dark</option>
                        <option value="bg-grad-2" class="text-black">2. Blood</option>
                        <option value="bg-grad-3" class="text-black">3. Ocean</option>
                        <option value="bg-grad-4" class="text-black">4. Forest</option>
                        <option value="bg-grad-5" class="text-black">5. Void</option>
                        <option value="bg-grad-6" class="text-black">6. Sunset</option>
                        <option value="bg-grad-7" class="text-black">7. Cyberpunk</option>
                        <option value="bg-grad-8" class="text-black">8. Abyss</option>
                        <option value="bg-grad-9" class="text-black">9. Earth</option>
                        <option value="bg-grad-10" class="text-black">10. Phantom</option>
                    </select>

                    <!-- 10 Theme Selector -->
                    <select id="theme-selector" class="bg-white/5 border border-white/10 text-xs font-bold rounded-lg px-2 py-2 outline-none text-white cursor-pointer hover:bg-white/10 transition max-w-[100px]" onchange="changeThemeAndBg()">
                        <option value="theme-emerald" class="text-black">🟩 Emerald</option>
                        <option value="theme-red" class="text-black">🟥 Red</option>
                        <option value="theme-blue" class="text-black">🟦 Blue</option>
                        <option value="theme-purple" class="text-black">🟪 Purple</option>
                        <option value="theme-gold" class="text-black">🟨 Gold</option>
                        <option value="theme-cyan" class="text-black">🩵 Cyan</option>
                        <option value="theme-pink" class="text-black">🩷 Pink</option>
                        <option value="theme-orange" class="text-black">🟧 Orange</option>
                        <option value="theme-silver" class="text-black">⬜ Silver</option>
                        <option value="theme-neon" class="text-black">🍏 Neon</option>
                    </select>

                    <div class="w-px h-6 bg-white/10 mx-1"></div>

                    <!-- Tools Lanjutan -->
                    <button onclick="openBulkModal()" class="bg-indigo-500/20 hover:bg-indigo-500/40 text-indigo-300 px-3 py-2 rounded-lg text-xs flex items-center gap-2 transition font-bold border border-indigo-500/30">
                        <i data-lucide="clipboard-paste" class="w-4 h-4"></i> Paste
                    </button>
                    
                    <button onclick="shuffleTeams()" class="bg-amber-500/20 hover:bg-amber-500/40 text-amber-300 px-3 py-2 rounded-lg text-xs flex items-center gap-2 transition font-bold border border-amber-500/30" title="Acak Posisi">
                        <i data-lucide="shuffle" class="w-4 h-4"></i> Acak
                    </button>

                    <!-- Tes AI / Bot -->
                    <div class="relative group">
                        <button class="bg-emerald-500/20 hover:bg-emerald-500/40 text-emerald-300 px-3 py-2 rounded-lg text-xs flex items-center gap-2 transition font-bold border border-emerald-500/30">
                            Bot <i data-lucide="chevron-down" class="w-3 h-3"></i>
                        </button>
                        <div class="absolute bottom-full right-0 mb-2 hidden group-hover:block w-40 bg-slate-800/95 backdrop-blur-md border border-slate-600 rounded-xl shadow-2xl overflow-hidden z-[100]">
                            <button onclick="generateAITeams()" class="w-full text-left px-4 py-2.5 hover:bg-slate-700 text-xs text-amber-300 font-bold transition flex items-center gap-2 border-b border-white/5">
                                <i data-lucide="sparkles" class="w-4 h-4"></i> AI Gen Nama
                            </button>
                            <button onclick="autoFillNames()" class="w-full text-left px-4 py-2.5 hover:bg-slate-700 text-xs text-slate-200 transition flex items-center gap-2 border-b border-white/5">

                            </button>
                            <button onclick="autoFillScores()" class="w-full text-left px-4 py-2.5 hover:bg-slate-700 text-xs text-slate-200 transition flex items-center gap-2">

                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                    
                    <button onclick="logoutAdmin()" class="bg-white/10 hover:bg-white/20 text-white px-2.5 py-2 rounded-lg transition" title="Logout">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Tombol Login Kecil (Muncul jika belum admin) -->
                <button onclick="loginAdminPrompt()" id="btn-login" class="bg-black/60 backdrop-blur-md border border-white/20 hover:bg-white/10 p-3 rounded-full shadow-2xl text-slate-300 transition-all hover:scale-110">
                    <i data-lucide="lock" class="w-5 h-5"></i>
                </button>

            </div>

    <!-- Modal Paste (Bulk) -->
    <div id="bulk-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-lg shadow-2xl">
            <h3 class="text-xl font-bold text-white mb-2">Paste Nama Tim</h3>
            <p class="text-sm text-slate-400 mb-4">Paste daftar nama (satu per baris). Sistem otomatis membagi adil.</p>
            <textarea id="bulk-textarea" class="w-full h-56 bg-slate-800/80 border border-slate-600 rounded-xl p-4 text-sm text-slate-100 outline-none focus:border-indigo-500 transition-colors" placeholder="Tim A&#10;Tim B&#10;Tim C"></textarea>
            <div class="flex justify-end gap-3 mt-5">
                <button onclick="closeBulkModal()" class="px-5 py-2.5 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-800 transition">Batal</button>
                <button onclick="saveBulkModal()" class="px-5 py-2.5 rounded-lg text-sm font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg transition">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal AI Komentator -->
    <div id="ai-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[110] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-amber-500/40 rounded-2xl p-6 w-full max-w-md shadow-[0_0_50px_rgba(245,158,11,0.2)] relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-amber-500 via-yellow-300 to-amber-500"></div>
            <div class="flex items-center gap-3 mb-5">
                <div class="bg-amber-500/20 p-2 rounded-full"><i data-lucide="bot" class="w-6 h-6 text-amber-500"></i></div>
                <h3 class="text-xl font-black text-white tracking-tight">Komentator AI</h3>
            </div>
            <div id="ai-text" class="min-h-[100px] flex flex-col items-center justify-center p-4 bg-slate-800/50 rounded-xl border border-slate-700/50">
                <!-- Konten diproses -->
            </div>
            <div class="flex justify-end mt-6">
                <button onclick="closeAIModal()" class="px-6 py-2.5 rounded-xl text-sm font-bold bg-white/10 hover:bg-white/20 text-white transition-colors">Tutup</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        lucide.createIcons();

        let isAdmin = false;
        let svgTimeout;
        let isHeaderShrinkEnabled = true;
        let particleInterval;
        let currentParticleType = null;
        
        let tournamentData = {
            title: "Turnamen Bracket Live",
            subtitle: "",
            period: "",
            size: 16,        
            actualSize: 16,  
            theme: "theme-emerald",
            bgTheme: "bg-grad-1",
            particleType: "star",
            locationUrl: "https://maps.app.goo.gl/reHkx6shAXRKqTq99",
            teamFontSize: 14,
            matches: {}
        };

        const firebaseConfig = {
            apiKey: "AIzaSyA1hCoZklSfmy9ntHFFBvnQk6puBvX6aUI",
            authDomain: "turnamen-bracket-afe1e.firebaseapp.com",
            projectId: "turnamen-bracket-afe1e",
            storageBucket: "turnamen-bracket-afe1e.firebasestorage.app",
            messagingSenderId: "486368316980",
            appId: "1:486368316980:web:dfa97e7a04f8a33e7b4461"
        };

        window.onload = () => {
            initFirebase();
            setupPanZoom();
            startRealtimeClock();
            setupScrollHeaderBehavior();
            
            window.addEventListener('resize', () => {
                clearTimeout(svgTimeout);
                svgTimeout = setTimeout(drawLines, 100);
            });
        };

        // --- Fitur Toggle Pojok Kanan Atas ---
        function toggleHeaderShrink() {
            isHeaderShrinkEnabled = !isHeaderShrinkEnabled;
            document.getElementById('icon-header-toggle').setAttribute('data-lucide', isHeaderShrinkEnabled ? 'pin' : 'pin-off');
            lucide.createIcons();
            handleScroll(); // Sesuaikan ulang layout berdasarkan statenya
        }

        function startParticles(type) {
            if (particleInterval) clearInterval(particleInterval);
            if (type === 'none') {
                const container = document.getElementById('particles-container');
                if(container) container.innerHTML = '';
                return;
            }
            let freq = type === 'dust' ? 250 : (type === 'bubble' ? 500 : 400);
            particleInterval = setInterval(() => createParticle(type), freq);
        }

        function createParticle(type) {
            const container = document.getElementById('particles-container');
            if (!container || document.visibilityState !== 'visible') return;
            
            const p = document.createElement('div');
            let size;
            
            if (type === 'bubble') {
                size = Math.random() * 12 + 4; 
                p.className = 'absolute pointer-events-none border border-white/30 rounded-full bg-white/5 backdrop-blur-sm';
            } else if (type === 'dust') {
                size = Math.random() * 4 + 1;
                p.className = 'absolute pointer-events-none bg-slate-300 rounded-full opacity-60';
            } else {
                // star
                size = Math.random() * 4 + 2; 
                p.className = 'absolute pointer-events-none bg-amber-200 shadow-[0_0_5px_#fde047] rounded-full';
            }
            
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.bottom = '-20px';
            p.style.setProperty('--max-opacity', Math.random() * 0.5 + 0.2);
            p.style.animation = `floatUp ${Math.random() * 8 + 6}s linear forwards`;
            
            container.appendChild(p);
            // Hapus elemen setelah animasi selesai (sekitar 14 detik maksimal)
            setTimeout(() => { if (p.parentNode) p.remove(); }, 14000);
        }

        // --- Logika Header Menyusut ---
        function handleScroll() {
            const panContainer = document.getElementById('pan-container');
            const header = document.getElementById('main-header');
            const title = document.getElementById('tournament-title');
            const subtitle = document.getElementById('tournament-subtitle');
            const clockContainer = document.getElementById('clock-container');

            if (isHeaderShrinkEnabled && panContainer.scrollTop > 40) {
                // Header menyusut dan background blur
                header.classList.add('bg-slate-900/90', 'backdrop-blur-xl', 'border-b', 'border-white/10', 'shadow-2xl');
                header.classList.remove('pt-8', 'pb-6');
                header.classList.add('pt-3', 'pb-3');
                
                title.classList.replace('text-4xl', 'text-2xl');
                title.classList.replace('md:text-5xl', 'md:text-3xl');
                
                subtitle.classList.replace('text-lg', 'text-sm');
                subtitle.classList.replace('md:text-xl', 'text-sm');
                subtitle.classList.replace('mt-2', 'mt-0');
                
                clockContainer.classList.add('scale-y-0', 'h-0', 'opacity-0');
                clockContainer.classList.remove('mt-4');
            } else {
                // Header kembali membesar (Normal) atau saat Auto-Shrink mati
                header.classList.remove('bg-slate-900/90', 'backdrop-blur-xl', 'border-b', 'border-white/10', 'shadow-2xl');
                header.classList.remove('pt-3', 'pb-3');
                header.classList.add('pt-8', 'pb-6');
                
                title.classList.replace('text-2xl', 'text-4xl');
                title.classList.replace('md:text-3xl', 'md:text-5xl');
                
                subtitle.classList.replace('text-sm', 'text-lg');
                subtitle.classList.replace('text-sm', 'md:text-xl');
                subtitle.classList.replace('mt-0', 'mt-2');
                
                clockContainer.classList.remove('scale-y-0', 'h-0', 'opacity-0');
                clockContainer.classList.add('mt-4');
            }
        }

        function setupScrollHeaderBehavior() {
            const panContainer = document.getElementById('pan-container');
            panContainer.addEventListener('scroll', handleScroll);
        }

        function startRealtimeClock() {
            const hmEl = document.getElementById('clock-hm');
            const sEl = document.getElementById('clock-s');
            const dateEl = document.getElementById('realtime-date');
            
            setInterval(() => {
                const now = new Date();
                const hh = now.getHours().toString().padStart(2, '0');
                const mm = now.getMinutes().toString().padStart(2, '0');
                const ss = now.getSeconds().toString().padStart(2, '0');
                
                hmEl.innerText = `${hh}:${mm}:`;
                sEl.innerText = ss;
                
                dateEl.innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }, 1000);
        }

        function initFirebase() {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                window.db = firebase.firestore();
                const docRef = window.db.collection('turnamen').doc('data_bagan');

                docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data && data.matches && Object.keys(data.matches).length > 0) {
                            tournamentData = { ...tournamentData, ...data };
                        } else generateEmptyMatches(16, 16);
                    } else generateEmptyMatches(16, 16);
                    applyStateToUI();
                    updateSyncStatus(true);
                }, (error) => {
                    updateSyncStatus(false, "Terputus");
                });
            } catch (error) {
                updateSyncStatus(false, "Error");
                generateEmptyMatches(16, 16);
                applyStateToUI();
            }
        }

        function applyStateToUI() {
            const syncInput = (id, field) => {
                const el = document.getElementById(id);
                if (!el) return;
                if (document.activeElement !== el) el.value = tournamentData[field] || "";
                if(isAdmin) { el.removeAttribute('readonly'); el.classList.add('cursor-text'); } 
                else { el.setAttribute('readonly', true); el.classList.remove('cursor-text'); }
            };

            syncInput('tournament-title', 'title');
            syncInput('tournament-subtitle', 'subtitle');
            syncInput('tournament-period', 'period');
            
            // Sinkronkan tab browser title
            document.title = tournamentData.title || "Bagan Turnamen";

            // Terapkan Tema dan Latar Belakang ke elemen body
            document.getElementById('app-body').className = `${tournamentData.theme || 'theme-emerald'} ${tournamentData.bgTheme || 'bg-grad-1'} bg-animated h-screen flex flex-col transition-colors duration-700 relative`;
            document.getElementById('theme-selector').value = tournamentData.theme || 'theme-emerald';
            document.getElementById('bg-selector').value = tournamentData.bgTheme || 'bg-grad-1';
            
            const partSel = document.getElementById('particle-selector');
            if (partSel) partSel.value = tournamentData.particleType || 'star';

            const locLink = document.getElementById('location-link');
            if (locLink) locLink.href = tournamentData.locationUrl || "https://maps.app.goo.gl/reHkx6shAXRKqTq99";
            
            const sizeInput = document.getElementById('size-input');
            if (document.activeElement !== sizeInput) sizeInput.value = (tournamentData.actualSize || tournamentData.size || 16).toString();

            // Setel Ukuran Font Tim
            const fSize = tournamentData.teamFontSize || 14;
            document.documentElement.style.setProperty('--team-font-size', `${fSize}px`);
            const fontDisp = document.getElementById('font-size-disp');
            if (fontDisp) fontDisp.innerText = fSize;

            const adminTools = document.getElementById('admin-tools');
            const btnEditLoc = document.getElementById('btn-edit-location');
            const btnLogin = document.getElementById('btn-login'); // <- Variabel ini yang sebelumnya terlewat
            
            if(isAdmin) {
                if(btnLogin) btnLogin.classList.add('hidden');
                adminTools.classList.remove('hidden'); adminTools.classList.add('flex');
                if (btnEditLoc) btnEditLoc.classList.remove('hidden');
            } else {
                if(btnLogin) btnLogin.classList.remove('hidden');
                adminTools.classList.add('hidden'); adminTools.classList.remove('flex');
                if (btnEditLoc) btnEditLoc.classList.add('hidden');
            }

            // Sinkronisasi tipe partikel dari Firebase
            const pType = tournamentData.particleType || 'star';
            if (currentParticleType !== pType) {
                currentParticleType = pType;
                startParticles(pType);
            }

            renderBracketDOM();
            updateDatalist();
            checkWinnerBoard();
            
            clearTimeout(svgTimeout);
            svgTimeout = setTimeout(() => { drawLines(); centerScroll(); }, 150);
        }

        function centerScroll() {
            const pan = document.getElementById('pan-container');
            if (pan && pan.scrollWidth > pan.clientWidth && pan.scrollLeft === 0) {
                pan.scrollLeft = (pan.scrollWidth - pan.clientWidth) / 2;
            }
        }

        function checkWinnerBoard() {
            const finalMatch = tournamentData.matches['final'];
            const bronzeMatch = tournamentData.matches['bronze'];
            const board = document.getElementById('winner-board');
            
            if (!finalMatch) return;
            const s1 = parseInt(finalMatch.s1); const s2 = parseInt(finalMatch.s2);
            
            if (!isNaN(s1) && !isNaN(s2) && s1 !== s2 && finalMatch.t1 && finalMatch.t2) {
                const winner = s1 > s2 ? finalMatch.t1 : finalMatch.t2;
                const runnerUp = s1 > s2 ? finalMatch.t2 : finalMatch.t1;
                
                document.getElementById('winner-1').innerText = winner;
                document.getElementById('winner-2').innerText = runnerUp;
                
                let thirdPlace = "MENUNGGU HASIL";
                if (bronzeMatch) {
                    const bs1 = parseInt(bronzeMatch.s1); const bs2 = parseInt(bronzeMatch.s2);
                    if (!isNaN(bs1) && !isNaN(bs2) && bs1 !== bs2 && bronzeMatch.t1 && bronzeMatch.t2) {
                        thirdPlace = bs1 > bs2 ? bronzeMatch.t1 : bronzeMatch.t2;
                    }
                }
                document.getElementById('winner-3').innerText = thirdPlace;

                board.classList.remove('hidden'); void board.offsetWidth; 
                board.classList.remove('scale-95', 'opacity-0');
                board.classList.add('scale-100', 'opacity-100', 'flex');
            } else {
                board.classList.add('scale-95', 'opacity-0'); board.classList.remove('scale-100', 'opacity-100');
                setTimeout(() => { if(board.classList.contains('opacity-0')) { board.classList.add('hidden'); board.classList.remove('flex'); } }, 500);
            }
        }

        function renderBracketDOM() {
            const container = document.getElementById('bracket-content');
            container.innerHTML = ''; 
            
            const size = parseInt(tournamentData.size) || 16;
            const totalRounds = Math.log2(size);
            
            for (let round = 1; round < totalRounds; round++) container.appendChild(createRoundColumn(round, totalRounds, 'l'));
            container.appendChild(createFinalColumn(totalRounds));
            for (let round = totalRounds - 1; round >= 1; round--) container.appendChild(createRoundColumn(round, totalRounds, 'r'));
        }

        function createRoundColumn(roundNum, totalRounds, side) {
            const col = document.createElement('div');
            col.className = 'flex flex-col gap-8 justify-around h-full z-10 relative';
            const matchCount = (parseInt(tournamentData.size) / 2) / Math.pow(2, roundNum - 1);
            let roundName = matchCount === 2 ? "SEMIFINAL" : (matchCount === 4 ? "PEREMPAT FINAL" : `${matchCount * 2} BESAR`);
            
            col.innerHTML = `<div class="text-center text-[11px] font-black opacity-60 uppercase tracking-[0.2em] mb-2 text-white">${roundName}</div>`;

            for (let i = 1; i <= matchCount / 2; i++) {
                const matchId = `r${roundNum}_${side}_${i}`;
                const nextId = (roundNum + 1 === totalRounds) ? 'final' : `r${roundNum + 1}_${side}_${Math.ceil(i / 2)}`;
                col.appendChild(createMatchCard(matchId, { id: nextId }, side));
            }
            return col;
        }

        function createFinalColumn() {
            const col = document.createElement('div');
            col.className = 'flex flex-col items-center justify-center min-h-full shrink-0 mx-6 z-10 relative';
            
            // Kotak Final ditaruh di dalam container agar tingginya di tengah layar secara akurat
            const finalWrapper = document.createElement('div');
            finalWrapper.className = 'flex flex-col gap-4 items-center relative z-20';
            finalWrapper.innerHTML = `<div class="text-center text-[12px] font-black text-amber-400 bg-amber-500/20 py-1.5 px-6 rounded-full border border-amber-500/40 uppercase tracking-widest backdrop-blur-md self-center shadow-[0_0_15px_rgba(245,158,11,0.2)]">BABAK FINAL</div>`;
            finalWrapper.appendChild(createMatchCard('final', null, 'c', true));
            col.appendChild(finalWrapper);

            // Kotak Juara 3 diposisikan Absolute supaya TIDAK MENGUBAH titik pusat (center) babak Final
            const bronzeWrapper = document.createElement('div');
            bronzeWrapper.className = 'absolute top-1/2 mt-[140px] flex flex-col gap-3 items-center z-10 w-full';
            bronzeWrapper.innerHTML = `<div class="text-center text-[10px] font-bold opacity-70 uppercase tracking-widest bg-black/40 py-1.5 px-5 rounded-full border border-white/20 backdrop-blur-md self-center text-white">PEREBUTAN JUARA 3</div>`;
            bronzeWrapper.appendChild(createMatchCard('bronze', null, 'c'));
            col.appendChild(bronzeWrapper);
            
            return col;
        }

        function createMatchCard(matchId, nextMatchInfo, side, isFinal = false) {
            const match = tournamentData.matches[matchId] || { t1: '', s1: '', t2: '', s2: '', time: '' };
            const card = document.createElement('div');
            card.id = `card-${matchId}`;
            
            if (nextMatchInfo) { card.dataset.next = `card-${nextMatchInfo.id}`; card.dataset.side = side; }

            let borderClass = isFinal ? 'bracket-card rounded-xl border-amber-500 is-final' : 'bracket-card rounded-xl';
            if (matchId === 'bronze') borderClass = 'bracket-card opacity-95 rounded-xl';

            const s1 = parseInt(match.s1); const s2 = parseInt(match.s2);
            const isDone = (!isNaN(s1) && !isNaN(s2) && s1 !== s2);
            const t1Win = isDone && (s1 > s2); const t2Win = isDone && (s2 > s1);

            const timeVal = match.time || '';
            const showTime = isAdmin || timeVal !== '';
            
            const timeInputHTML = showTime ? `
                <input type="text" class="w-20 bg-transparent border-b border-dashed border-white/40 focus:border-white/80 outline-none text-right font-medium text-[10px] text-slate-300 transition-all pointer-events-auto ${isAdmin?'cursor-text hover:bg-white/5':'cursor-default'}" 
                placeholder="${isAdmin?'Tgl / Jam':''}" value="${timeVal}" ${isAdmin?'':'readonly'} 
                onchange="updateData('${matchId}', 'time', this.value)" 
                onblur="updateData('${matchId}', 'time', this.value)" 
                onkeydown="if(event.key==='Enter') this.blur();" title="Atur Waktu Main">
            ` : '';

            const statusHTML = isDone 
                ? '<span class="text-emerald-400 font-bold tracking-wider">Selesai</span>' 
                : '<span class="opacity-50 font-medium">Belum Selesai</span>';
            
            const titleText = isFinal ? 'FINAL' : (matchId === 'bronze' ? 'JUARA 3' : '');
            
            card.className = `match-card overflow-hidden transition-all duration-300 ${borderClass}`;
            
            let t1C = t1Win ? 'text-winner' : (isDone ? 'text-loser' : 'text-slate-100');
            let t2C = t2Win ? 'text-winner' : (isDone ? 'text-loser' : 'text-slate-100');
            let s1C = t1Win ? 'text-winner bg-winner' : (isDone ? 'text-loser bg-loser' : 'text-white bg-white/5');
            let s2C = t2Win ? 'text-winner bg-winner' : (isDone ? 'text-loser bg-loser' : 'text-white bg-white/5');

            if(isDone) card.dataset.winner = t1Win ? '1' : '2';
            if (match.t1 === 'BYE') t1C = 'opacity-30 italic font-normal text-slate-400';
            if (match.t2 === 'BYE') t2C = 'opacity-30 italic font-normal text-slate-400';

            const getReadOnly = () => isAdmin ? '' : 'readonly';
            // Menghapus text-[14px] agar diwariskan dari CSS Variabel `--team-font-size` secara dinamis
            const getInpCls = (isScore, clr) => isScore 
                ? `w-14 h-full text-center text-[15px] font-bold outline-none transition-colors pointer-events-auto ${clr} ${isAdmin?'border-l border-white/10 cursor-text focus:bg-white/20':'border-l border-white/10'}`
                : `w-full pl-4 pr-2 font-semibold bg-transparent border-none outline-none transition-colors pointer-events-auto placeholder-slate-500 ${clr} ${isAdmin?'focus:bg-white/10':''}`;

            card.innerHTML = `
                <div class="bg-black/40 px-3 py-1.5 flex justify-between items-center text-[9px] tracking-wider border-b border-white/10 backdrop-blur-sm min-h-[30px]">
                    <span class="${isFinal ? 'text-amber-500 font-black' : 'text-slate-400 font-bold'} uppercase shrink-0">${titleText}</span>
                    <div class="flex items-center gap-2 shrink-0 ml-auto z-20">
                        <button onclick="generateAICommentary('${matchId}')" class="text-amber-400 hover:text-white hover:scale-125 p-0.5 transition-all pointer-events-auto" title="Komentator AI Hype!">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5 drop-shadow-[0_0_3px_rgba(251,191,36,0.8)]"></i>
                        </button>
                        ${timeInputHTML}
                        <span class="bg-black/50 px-1.5 py-0.5 rounded border border-white/10 shrink-0">${statusHTML}</span>
                    </div>
                </div>
                <div class="flex items-stretch border-b border-white/10 team-row h-12 transition-colors">
                    <input type="text" class="${getInpCls(false, t1C)}" value="${match.t1}" placeholder="${matchId.startsWith('r1')?'Tim Atas':''}" ${getReadOnly()} onchange="updateData('${matchId}', 't1', this.value)">
                    <input type="number" class="${getInpCls(true, s1C)}" value="${match.s1}" placeholder="-" ${getReadOnly()} onchange="updateData('${matchId}', 's1', this.value)">
                </div>
                <div class="flex items-stretch team-row h-12 transition-colors">
                    <input type="text" class="${getInpCls(false, t2C)}" value="${match.t2}" placeholder="${matchId.startsWith('r1')?'Tim Bawah':''}" ${getReadOnly()} onchange="updateData('${matchId}', 't2', this.value)">
                    <input type="number" class="${getInpCls(true, s2C)}" value="${match.s2}" placeholder="-" ${getReadOnly()} onchange="updateData('${matchId}', 's2', this.value)">
                </div>
            `;
            return card;
        }

        function drawLines() {
            const svg = document.getElementById('svg-lines');
            const container = document.getElementById('bracket-container');
            const content = document.getElementById('bracket-content');
            
            if(!svg || !container || !content) return;
            svg.setAttribute('width', content.scrollWidth); svg.setAttribute('height', content.scrollHeight);
            svg.innerHTML = ''; 

            const containerRect = container.getBoundingClientRect();
            document.querySelectorAll('.match-card').forEach(card => {
                const nextId = card.dataset.next;
                if (!nextId) return;
                const nextCard = document.getElementById(nextId);
                if (!nextCard) return;

                const side = card.dataset.side; 
                const startRect = card.getBoundingClientRect();
                const endRect = nextCard.getBoundingClientRect();

                let startX, startY, endX, endY;
                const isActive = card.dataset.winner !== undefined;
                let strokeClass = isActive ? 'line-path line-active' : 'line-path';
                if (nextId === 'bronze') strokeClass = 'line-path'; 

                if (side === 'l') { startX = startRect.right - containerRect.left; endX = endRect.left - containerRect.left; } 
                else if (side === 'r') { startX = startRect.left - containerRect.left; endX = endRect.right - containerRect.left; } 
                else return;

                startY = (startRect.top - containerRect.top) + (startRect.height / 2);
                endY = (endRect.top - containerRect.top) + (endRect.height / 2);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                
                // Menggunakan Cubic Bezier Curve agar garis melengkung indah dan tidak pernah bersilangan memotong kotak lainnya
                const midX = startX + (side==='l'?1:-1)*(Math.abs(endX-startX)/2);
                const d = `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`;

                path.setAttribute('d', d); path.setAttribute('class', strokeClass);
                svg.appendChild(path);
            });
        }

        function saveDataToFirebase() {
            if(!isAdmin || !window.db) return;
            updateSyncStatus(false, "Menyimpan...");
            const cleanData = JSON.parse(JSON.stringify(tournamentData));
            window.db.collection('turnamen').doc('data_bagan').set(cleanData)
                .then(() => updateSyncStatus(true))
                .catch(err => { updateSyncStatus(false, "Gagal Simpan"); });
        }

        function updateSyncStatus(isSuccess, msg = null) {
            const statusDiv = document.getElementById('sync-status');
            if (isSuccess) {
                statusDiv.innerHTML = '<span class="text-emerald-400 font-bold flex items-center gap-1.5"><div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div> Live</span>';
            } else {
                statusDiv.innerHTML = `<span class="text-amber-400 font-bold flex items-center gap-1.5"><i data-lucide="refresh-cw" class="w-3 h-3 animate-spin"></i> ${msg || 'Memproses...'}</span>`;
            }
            lucide.createIcons();
        }

        function updateTitle(val) { 
            if(!isAdmin) return; 
            tournamentData.title = val; 
            document.title = val || "Bagan Turnamen";
            saveDataToFirebase(); 
        }
        function updateSubtitle(val) { if(!isAdmin) return; tournamentData.subtitle = val; saveDataToFirebase(); }
        function updatePeriod(val) { if(!isAdmin) return; tournamentData.period = val; saveDataToFirebase(); }

        function updateData(matchId, field, value) {
            if (!isAdmin) return;
            if(!tournamentData.matches[matchId]) return;
            tournamentData.matches[matchId][field] = value;
            processAutoAdvance(matchId);
            applyStateToUI(); saveDataToFirebase();
        }

        function processAutoAdvance(matchId) {
            const match = tournamentData.matches[matchId];
            if (!match) return;

            const s1 = parseInt(match.s1); const s2 = parseInt(match.s2);
            let winnerName = '', loserName = '';

            if (!isNaN(s1) && !isNaN(s2) && s1 !== s2) {
                winnerName = s1 > s2 ? match.t1 : match.t2;
                loserName = s1 > s2 ? match.t2 : match.t1;
            } else if (match.t1 === 'BYE' && match.t2 !== '' && match.t2 !== 'BYE') { winnerName = match.t2; } 
            else if (match.t2 === 'BYE' && match.t1 !== '' && match.t1 !== 'BYE') { winnerName = match.t1; }

            if (matchId.startsWith('r')) {
                const parts = matchId.split('_');
                const round = parseInt(parts[0].replace('r', ''));
                const side = parts[1]; const index = parseInt(parts[2]);
                const totalRounds = Math.log2(parseInt(tournamentData.size));
                
                let nextId = (round + 1 === totalRounds) ? 'final' : `r${round + 1}_${side}_${Math.ceil(index / 2)}`;
                let isSlot1 = (round + 1 === totalRounds) ? (side === 'l') : (index % 2 !== 0);

                if (tournamentData.matches[nextId]) {
                    if (isSlot1) tournamentData.matches[nextId].t1 = winnerName;
                    else tournamentData.matches[nextId].t2 = winnerName;
                    processAutoAdvance(nextId);
                }

                if (nextId === 'final' && tournamentData.matches['bronze'] && loserName !== '' && loserName !== 'BYE') {
                    if (side === 'l') tournamentData.matches['bronze'].t1 = loserName;
                    else tournamentData.matches['bronze'].t2 = loserName;
                    processAutoAdvance('bronze');
                }
            }
        }

        function generateEmptyMatches(bracketSize, actualSize) {
            tournamentData.matches = {};
            const totalRounds = Math.log2(bracketSize);
            const halfSize = bracketSize / 2;

            ['l', 'r'].forEach(side => {
                for (let round = 1; round < totalRounds; round++) {
                    for (let i = 1; i <= (halfSize / Math.pow(2, round - 1)); i++) {
                        tournamentData.matches[`r${round}_${side}_${i}`] = { t1: '', s1: '', t2: '', s2: '', time: '' };
                    }
                }
            });
            tournamentData.matches['final'] = { t1: '', s1: '', t2: '', s2: '', time: '' };
            tournamentData.matches['bronze'] = { t1: '', s1: '', t2: '', s2: '', time: '' };

            let byesCount = bracketSize - actualSize;
            let sortedR1 = [];
            for(let i=1; i<=halfSize; i++) { sortedR1.push(`r1_l_${i}`); sortedR1.push(`r1_r_${i}`); }

            for(let k=0; k<byesCount; k++) {
                if(sortedR1[k]) { let m = tournamentData.matches[sortedR1[k]]; m.t2 = 'BYE'; m.s1 = '1'; m.s2 = '0'; }
            }
            Object.keys(tournamentData.matches).forEach(id => {
                if(tournamentData.matches[id].t2 === 'BYE') processAutoAdvance(id);
            });
        }

        function searchTeam(query) {
            const searchStr = query.toLowerCase().trim();
            if (searchStr === 'admin1') { isAdmin = true; document.getElementById('search-input').value = ''; applyStateToUI(); return; }

            const inputs = document.querySelectorAll('.match-card input[type="text"]');
            inputs.forEach(input => {
                input.parentElement.classList.remove('bg-white/20', 'border-white/50');
                if (searchStr.length > 0 && input.value && input.value.toLowerCase().includes(searchStr)) {
                    input.parentElement.classList.add('bg-white/20', 'border-white/50');
                }
            });
        }

        function loginAdminPrompt() {
            const pwd = prompt("Masukkan password Admin:");
            if (pwd === "admin" || pwd === "admin1") { isAdmin = true; applyStateToUI(); }
            else if (pwd !== null) alert("Password Salah!");
        }

        function logoutAdmin() { isAdmin = false; applyStateToUI(); }

        function changeFontSize(diff) {
            if(!isAdmin) return;
            let currentSize = tournamentData.teamFontSize || 14;
            currentSize += diff;
            
            // Batas ukuran (min 10px, max 30px)
            if (currentSize < 10) currentSize = 10;
            if (currentSize > 30) currentSize = 30;
            
            tournamentData.teamFontSize = currentSize;
            saveDataToFirebase(); applyStateToUI();
        }

        function changeSize() {
            if(!isAdmin) return;
            const sizeInput = document.getElementById('size-input');
            const inputVal = parseInt(sizeInput.value);
            
            if(isNaN(inputVal) || inputVal < 2 || inputVal > 32) {
                alert("Jumlah tim minimal 2 dan maksimal 32!");
                sizeInput.value = tournamentData.actualSize;
                return;
            }
            
            if(confirm(`Membuat bagan baru untuk ${inputVal} tim akan MENGHAPUS semua nama & skor. Lanjut?`)) {
                tournamentData.actualSize = inputVal;
                let bSize = 2; 
                while (bSize < inputVal) bSize *= 2; 
                if (bSize < 4) bSize = 4;
                
                tournamentData.size = bSize; 
                generateEmptyMatches(bSize, inputVal);
                saveDataToFirebase(); 
                applyStateToUI();
            } else {
                sizeInput.value = tournamentData.actualSize; 
            }
        }

        function changeThemeAndBg() {
            if(!isAdmin) return;
            tournamentData.theme = document.getElementById('theme-selector').value;
            tournamentData.bgTheme = document.getElementById('bg-selector').value;
            saveDataToFirebase(); applyStateToUI();
        }

        function changeParticle() {
            if(!isAdmin) return;
            tournamentData.particleType = document.getElementById('particle-selector').value;
            saveDataToFirebase(); applyStateToUI();
        }

        function editLocationPrompt() {
            if(!isAdmin) return;
            const current = tournamentData.locationUrl || "https://maps.app.goo.gl/reHkx6shAXRKqTq99";
            const newUrl = prompt("Masukkan Link Google Maps Baru (URL):", current);
            if(newUrl !== null && newUrl.trim() !== "") {
                tournamentData.locationUrl = newUrl.trim();
                saveDataToFirebase(); applyStateToUI();
            }
        }

        function resetData() {
            if(!isAdmin) return;
            if(confirm("Hapus semua nama dan skor?")) {
                generateEmptyMatches(tournamentData.size, tournamentData.actualSize);
                saveDataToFirebase(); applyStateToUI();
            }
        }

        function openBulkModal() { document.getElementById('bulk-modal').classList.remove('hidden'); }
        function closeBulkModal() { document.getElementById('bulk-modal').classList.add('hidden'); document.getElementById('bulk-textarea').value = ''; }
        function saveBulkModal() {
            if(!isAdmin) return;
            const lines = document.getElementById('bulk-textarea').value.split('\n').map(t => t.trim()).filter(t => t.length > 0);
            if(lines.length === 0) return closeBulkModal();

            let r1Slots = []; const half = tournamentData.size / 2;
            for(let i=1; i<=half; i++) {
                let keyL = `r1_l_${i}`; if(tournamentData.matches[keyL].t1 !== 'BYE') r1Slots.push({key: keyL, slot: 't1'});
                let keyR = `r1_r_${i}`; if(tournamentData.matches[keyR].t1 !== 'BYE') r1Slots.push({key: keyR, slot: 't1'});
                if(tournamentData.matches[keyL].t2 !== 'BYE') r1Slots.push({key: keyL, slot: 't2'});
                if(tournamentData.matches[keyR].t2 !== 'BYE') r1Slots.push({key: keyR, slot: 't2'});
            }
            r1Slots.forEach((info, idx) => { if(lines[idx] !== undefined) { tournamentData.matches[info.key][info.slot] = lines[idx]; processAutoAdvance(info.key); } });
            closeBulkModal(); saveDataToFirebase(); applyStateToUI();
        }

        function shuffleTeams() {
            if(!isAdmin) return;
            if(!confirm("Acak posisi tim ronde 1 (dan Reset skor)?")) return;
            let currentTeams = [];
            Object.keys(tournamentData.matches).forEach(k => {
                if(k.startsWith('r1_')) {
                    let m = tournamentData.matches[k];
                    if(m.t1 && m.t1 !== 'BYE') currentTeams.push(m.t1); if(m.t2 && m.t2 !== 'BYE') currentTeams.push(m.t2);
                }
            });
            currentTeams.sort(() => Math.random() - 0.5);
            Object.keys(tournamentData.matches).forEach(k => {
                let m = tournamentData.matches[k];
                if (m.t1 !== 'BYE' && m.t2 !== 'BYE') { m.s1 = ''; m.s2 = ''; }
                if (!k.startsWith('r1_')) { m.t1 = ''; m.t2 = ''; } 
            });
            let idx = 0; const half = tournamentData.size / 2;
            for(let i=1; i<=half; i++) {
                let mL = tournamentData.matches[`r1_l_${i}`]; let mR = tournamentData.matches[`r1_r_${i}`];
                if(mL.t1 !== 'BYE' && currentTeams[idx]) { mL.t1 = currentTeams[idx++]; processAutoAdvance(`r1_l_${i}`); }
                if(mR.t1 !== 'BYE' && currentTeams[idx]) { mR.t1 = currentTeams[idx++]; processAutoAdvance(`r1_r_${i}`); }
                if(mL.t2 !== 'BYE' && currentTeams[idx]) { mL.t2 = currentTeams[idx++]; processAutoAdvance(`r1_l_${i}`); }
                if(mR.t2 !== 'BYE' && currentTeams[idx]) { mR.t2 = currentTeams[idx++]; processAutoAdvance(`r1_r_${i}`); }
            }
            saveDataToFirebase(); applyStateToUI();
        }

        const teamPool = ["RRQ", "Evos", "Onic", "Alter Ego", "BTR", "Geek Fam", "Aura", "Rebellion", "T1", "Navi", "Fnatic", "Paper Rex"];
        function autoFillNames() {
            if(!isAdmin) return;
            let pPool = [...teamPool].sort(() => 0.5 - Math.random()); let tIdx = 0;
            Object.keys(tournamentData.matches).forEach(id => {
                if(id.startsWith('r1_')) {
                    let m = tournamentData.matches[id];
                    if (m.t1 === '' && m.t1 !== 'BYE') { m.t1 = pPool[tIdx % pPool.length]; tIdx++; processAutoAdvance(id); }
                    if (m.t2 === '' && m.t2 !== 'BYE') { m.t2 = pPool[tIdx % pPool.length]; tIdx++; processAutoAdvance(id); }
                }
            });
            saveDataToFirebase(); applyStateToUI();
        }

        function autoFillScores() {
            if(!isAdmin) return;
            let isChanged = false;
            Object.keys(tournamentData.matches).forEach(id => {
                const m = tournamentData.matches[id];
                if (m.t1 === 'BYE' || m.t2 === 'BYE') return;
                if (m.t1 !== '' && m.t2 !== '' && m.s1 === '' && m.s2 === '') {
                    let s1 = Math.floor(Math.random() * 4); let s2 = Math.floor(Math.random() * 4);
                    while(s1 === s2) s2 = Math.floor(Math.random() * 4);
                    m.s1 = s1.toString(); m.s2 = s2.toString();
                    isChanged = true;
                }
            });
            if (isChanged) { Object.keys(tournamentData.matches).forEach(id => processAutoAdvance(id)); saveDataToFirebase(); applyStateToUI(); }
        }

        function updateDatalist() {
            let allTeams = new Set();
            Object.values(tournamentData.matches).forEach(m => {
                if(m.t1 && m.t1 !== 'BYE') allTeams.add(m.t1); if(m.t2 && m.t2 !== 'BYE') allTeams.add(m.t2);
            });
            const datalist = document.getElementById('team-list');
            if (datalist) datalist.innerHTML = Array.from(allTeams).map(t => `<option value="${t}">`).join('');
        }

        function setupPanZoom() {
            const container = document.getElementById('pan-container');
            let isDown = false; let startX, startY, scrollLeft, scrollTop;

            container.addEventListener('mousedown', (e) => {
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                isDown = true; container.style.cursor = 'grabbing';
                startX = e.pageX - container.offsetLeft; startY = e.pageY - container.offsetTop;
                scrollLeft = container.scrollLeft; scrollTop = container.scrollTop;
            });
            const stopDrag = () => { isDown = false; container.style.cursor = 'grab'; };
            container.addEventListener('mouseleave', stopDrag); container.addEventListener('mouseup', stopDrag);
            container.addEventListener('mousemove', (e) => {
                if (!isDown) return; e.preventDefault();
                container.scrollLeft = scrollLeft - ((e.pageX - container.offsetLeft) - startX);
                container.scrollTop = scrollTop - ((e.pageY - container.offsetTop) - startY);
            });
        }

        async function callGeminiText(prompt, systemPrompt = "Kamu adalah komentator e-sports yang sangat hype dan antusias. Gunakan bahasa gaul Indonesia kekinian, bersemangat, tapi tetap profesional dan tidak bertele-tele.") {
            const apiKey = ""; // API Key disuntikkan secara aman via lingkungan Immersive
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } };
            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.candidates && result.candidates[0].content) return result.candidates[0].content.parts[0].text;
                return "Maaf, AI sedang mengalami gangguan sinyal. Coba lagi nanti!";
            } catch (e) {
                console.error("Gemini API Error:", e);
                return "Terjadi kesalahan sistem saat memanggil AI.";
            }
        }

        async function generateAITeams() {
            if(!isAdmin) return;
            updateSyncStatus(false, "AI Bekerja...");
            let emptyCount = 0;
            Object.keys(tournamentData.matches).forEach(id => {
                if(id.startsWith('r1_')) {
                    let m = tournamentData.matches[id];
                    if (m.t1 === '' && m.t1 !== 'BYE') emptyCount++; if (m.t2 === '' && m.t2 !== 'BYE') emptyCount++;
                }
            });
            if (emptyCount === 0) { alert("Tidak ada slot kosong di babak 1."); updateSyncStatus(true); return; }

            const prompt = `Buatkan ${emptyCount} nama tim e-sports yang unik, keren, lucu dan belum pernah ada. HANYA pisahkan dengan koma (,). Jangan tambahkan teks, titik, atau penomoran apapun selain nama-nama tersebut.`;
            const namesText = await callGeminiText(prompt, "Kamu adalah generator nama tim profesional.");
            const names = namesText.split(',').map(n => n.trim().replace(/['"]/g, '')).filter(n => n.length > 0);

            let tIdx = 0;
            Object.keys(tournamentData.matches).forEach(id => {
                if(id.startsWith('r1_')) {
                    let m = tournamentData.matches[id];
                    if (m.t1 === '' && m.t1 !== 'BYE' && names[tIdx]) { m.t1 = names[tIdx++]; }
                    if (m.t2 === '' && m.t2 !== 'BYE' && names[tIdx]) { m.t2 = names[tIdx++]; }
                    processAutoAdvance(id);
                }
            });
            saveDataToFirebase(); applyStateToUI(); updateSyncStatus(true);
        }

        async function generateAICommentary(matchId) {
            const match = tournamentData.matches[matchId];
            if(!match || !match.t1 || !match.t2 || match.t1 === 'BYE' || match.t2 === 'BYE') { alert("Kedua tim harus terisi terlebih dahulu untuk mendapatkan komentar AI!"); return; }

            const modal = document.getElementById('ai-modal');
            const textContainer = document.getElementById('ai-text');
            textContainer.innerHTML = '<i data-lucide="loader-2" class="w-8 h-8 animate-spin text-amber-500 mx-auto mb-3"></i><p class="text-xs text-slate-300 animate-pulse font-bold">AI sedang menyusun komentar hype...</p>';
            lucide.createIcons(); modal.classList.remove('hidden');

            let scoreContext = (match.s1 !== '' && match.s2 !== '') ? `Skor sementara adalah ${match.t1} [${match.s1}] - [${match.s2}] ${match.t2}.` : `Pertandingan ini baru saja akan dimulai atau belum ada skor.`;
            const matchTitle = matchId === 'final' ? "Babak Grand Final" : (matchId === 'bronze' ? "Perebutan Juara 3" : "Fase Gugur");

            const prompt = `Berikan komentar singkat (maksimal 2 kalimat) yang sangat hype, seru, dan menegangkan untuk pertandingan e-sports ${matchTitle} antara tim "${match.t1}" melawan tim "${match.t2}". ${scoreContext}`;
            const responseText = await callGeminiText(prompt);
            textContainer.innerHTML = `<p class="text-[15px] text-white leading-relaxed italic font-medium text-center">"${responseText}"</p>`;
        }

        window.closeAIModal = function() { document.getElementById('ai-modal').classList.add('hidden'); };

    </script>
</body>
